name: AiScore public HTML audit
on:
  push:
    branches: [diag/aiscore-feed-20261127]
    paths: ['.github/workflows/aiscore-public-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public football catalog and match pages
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.robotparser, re, json, time
          from urllib.parse import urljoin,urlsplit
          from html.parser import HTMLParser
          base="https://www.aiscore.com"
          agent="GOOL-Data-Research/1.0"
          robots=urllib.robotparser.RobotFileParser(base+"/robots.txt")
          robots.read()
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__();self.links=set();self.scripts=[];self.active=False;self.buf=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="a" and a.get("href"):self.links.add(urljoin(base,a["href"]))
                  if tag=="script":self.active=True;self.buf=[]
              def handle_data(self,data):
                  if self.active:self.buf.append(data)
              def handle_endtag(self,tag):
                  if tag=="script" and self.active:self.scripts.append("".join(self.buf));self.active=False
          def probe(url):
              if not robots.can_fetch(agent,url):
                  print("ROBOTS_DISALLOWED",url);return None
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":agent,"Accept":"text/html"}),timeout=20) as r:
                      raw=r.read(5000001)
                      if len(raw)>5000000:raise ValueError("response too large")
                      html=raw.decode("utf-8","replace")
                      p=Page();p.feed(html)
                      print("PAGE",json.dumps(dict(url=url,http=r.status,bytes=len(raw),match_links=sum("/match-" in x for x in p.links),scripts=[dict(size=len(x),nuxt="__NUXT__" in x,json_data="__NEXT_DATA__" in x) for x in p.scripts if len(x)>1000],markers={k:len(re.findall(k,html,re.I)) for k in ["dangerous attacks","shots on target","possession","odds","head to head","lineup","live"]})))
                      return p
              except urllib.error.HTTPError as e:
                  print("HTTP_ERROR",url,e.code)
                  if e.code in (401,403,429):raise SystemExit(1)
              except Exception as e:print("ERROR",url,str(e))
          p=probe(base+"/")
          if p:
              links=sorted(x for x in p.links if urlsplit(x).hostname=="www.aiscore.com" and "/match-" in urlsplit(x).path)
              print("CATALOG_LINKS",len(links),json.dumps(links[:8]))
              for url in links[:3]:
                  time.sleep(5);probe(url)
          else:raise SystemExit(1)
          PY
