name: another goal context regression

on:
  push:
    branches:
      - fix/two-system-entry-windows
    paths:
      - 'src/gool_bot2/multi_another_goal_guard.py'
      - 'src/gool_bot2/xbet_market_pressure.py'
      - 'src/gool_bot2/multi_runtime.py'
      - 'src/gool_bot2/multi_entry_enrichment.py'
      - 'tests/test_multi_another_goal_guard.py'
      - 'tests/test_xbet_live_1x2.py'
      - '.github/workflows/another-goal-context-regression.yml'
  pull_request:
    paths:
      - 'src/gool_bot2/multi_another_goal_guard.py'
      - 'src/gool_bot2/xbet_market_pressure.py'
      - 'src/gool_bot2/multi_runtime.py'
      - 'src/gool_bot2/multi_entry_enrichment.py'
      - 'tests/test_multi_another_goal_guard.py'
      - 'tests/test_xbet_live_1x2.py'
      - '.github/workflows/another-goal-context-regression.yml'
  workflow_dispatch:

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff
      - name: Run targeted regressions
        run: |
          pytest -q \
            tests/test_multi_another_goal_guard.py \
            tests/test_xbet_live_1x2.py \
            tests/test_multi_two_system_concept.py \
            tests/test_multi_reentry_strategy.py
      - name: Ruff correctness gate
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/gool_bot2/multi_another_goal_guard.py \
            src/gool_bot2/xbet_market_pressure.py \
            src/gool_bot2/multi_runtime.py \
            src/gool_bot2/multi_entry_enrichment.py \
            tests/test_multi_another_goal_guard.py \
            tests/test_xbet_live_1x2.py
