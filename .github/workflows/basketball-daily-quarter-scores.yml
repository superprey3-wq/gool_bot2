name: Basketball quarter pattern audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/basketball_daily_quarters.py'
      - '.github/workflows/basketball-daily-quarter-scores.yml'

jobs:
  quarter-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install GOOL Bot 2
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Collect 2026-10-05 basketball quarter scores
        run: |
          python scripts/basketball_daily_quarters.py --date 2026-10-05 --tz Europe/Moscow --out-dir artifacts/basketball_daily_quarters

      - name: Publish report
        if: always()
        run: |
          if [ -f artifacts/basketball_daily_quarters/report.md ]; then
            cat artifacts/basketball_daily_quarters/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basketball-quarter-pattern-audit-2026-10-05
          path: artifacts/basketball_daily_quarters/
          if-no-files-found: error
          retention-days: 2
