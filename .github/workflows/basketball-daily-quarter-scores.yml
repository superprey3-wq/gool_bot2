name: Basketball daily quarter scores

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date in YYYY-MM-DD, blank = today in Europe/Moscow"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - 'scripts/basketball_daily_quarters.py'
      - '.github/workflows/basketball-daily-quarter-scores.yml'

jobs:
  quarter-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install GOOL Bot 2
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Collect all basketball matches and quarter scores
        env:
          AUDIT_DATE: ${{ github.event.inputs.date }}
        run: |
          ARGS=""
          if [ -n "${AUDIT_DATE}" ]; then
            ARGS="--date ${AUDIT_DATE}"
          fi
          python scripts/basketball_daily_quarters.py ${ARGS} --tz Europe/Moscow --out-dir artifacts/basketball_daily_quarters

      - name: Publish report
        if: always()
        run: |
          if [ -f artifacts/basketball_daily_quarters/report.md ]; then
            cat artifacts/basketball_daily_quarters/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basketball-daily-quarter-scores
          path: artifacts/basketball_daily_quarters/
          if-no-files-found: error
          retention-days: 7
