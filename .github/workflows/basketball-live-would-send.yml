name: Basketball LIVE would-send

on:
  push:
    branches:
      - "feature/multisport-market-tree-and-football-rescue"
    paths:
      - "src/gool_bot2/xbet_multisport_steam.py"
      - "src/gool_bot2/xbet_multisport_markets.py"
      - "scripts/gool_multisport_live_send_audit.py"
      - ".github/workflows/basketball-live-would-send.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basketball-would-send:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run focused 4-snapshot basketball audit
        env:
          AUDIT_SNAPSHOTS: "4"
          AUDIT_SLEEP_SECONDS: "8"
          GOOL_MULTISPORT_MODE: shadow
          GOOL_HOCKEY_ENABLED: "0"
          GOOL_BASKETBALL_ENABLED: "1"
          GOOL_MULTISPORT_PREMATCH_ENABLED: "0"
          XBET_MULTISPORT_TELEGRAM_ENABLED: "0"
          XBET_MULTISPORT_MAX_MAPPED_PER_SPORT: "20"
          XBET_MULTISPORT_GAME_WORKERS: "10"
          GOOL_MULTISPORT_HTTP_ATTEMPTS: "1"
          GOOL_MULTISPORT_LIVE_SUBGAME_CACHE_SECONDS: "5"
        run: python scripts/gool_multisport_live_send_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basketball-live-would-send
          path: artifacts/multisport_live_send_audit/
          retention-days: 7
