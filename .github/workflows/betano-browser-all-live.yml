name: betano-browser-all-live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/betano-browser-all-live.yml"
      - "scripts/betano_browser_flashscore_audit.py"

permissions:
  contents: write

jobs:
  betano-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GOOL and Chromium runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e . playwright
          python -m playwright install --with-deps chromium
          mkdir -p betano_browser_results

      - name: Audit Betano browser network against every current Flashscore LIVE match
        continue-on-error: true
        run: |
          python scripts/betano_browser_flashscore_audit.py \
            --output betano_browser_results/summary.json \
            --snapshots 3 \
            --interval 25 \
            --capture-seconds 10 \
            --limit 1000

      - name: Persist latest Betano browser result
        if: always()
        run: |
          if [ -f betano_browser_results/summary.json ]; then
            mkdir -p reports/betano_browser
            cp betano_browser_results/summary.json reports/betano_browser/latest-summary.json
            git config user.name 'gool-bot2-actions'
            git config user.email 'gool-bot2-actions@users.noreply.github.com'
            git add reports/betano_browser/latest-summary.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore: update Betano browser audit report'
              git push
            fi
          fi

      - name: Publish summary
        if: always()
        run: |
          echo '## Betano Chromium network → GOOL Flashscore' >> "$GITHUB_STEP_SUMMARY"
          if [ -f betano_browser_results/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path('betano_browser_results/summary.json').read_text())
          print(json.dumps({k:d.get(k) for k in ['generated_at','browser','snapshot_count','unique_flashscore_live_matches','snapshot_diagnostics','verdict_counts']}, indent=2))
          PY
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No summary produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Betano browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betano-browser-all-live
          path: betano_browser_results/
          if-no-files-found: warn
          retention-days: 7
