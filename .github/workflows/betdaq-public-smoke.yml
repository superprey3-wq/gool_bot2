name: BETDAQ public smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betdaq-public-smoke.yml'
  workflow_dispatch:

jobs:
  public-board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'websockets>=15,<16'
      - name: Probe direct lightweight BETDAQ websocket
        run: |
          python - <<'PY'
          import asyncio, json, random, string, uuid
          import websockets

          SOCCER_ID = 100003
          RS='\x01'; FS='\x02'
          def cmd(mid, fields):
              out=FS+str(mid)+RS
              for k,v in fields.items():
                  if isinstance(v,bool): v='T' if v else 'F'
                  out += str(k)+FS+str(v)+FS+RS
              return out

          async def main():
              server=f'{random.randrange(0,1000):03d}'
              session=''.join(random.choice(string.ascii_lowercase+string.digits) for _ in range(8))
              uri=f'wss://aapi-service.betdaq.com/AAPI/{server}/{session}/websocket'
              print('URI', uri)
              async with websockets.connect(
                  uri,
                  origin='https://www.betdaq.com',
                  user_agent_header='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
                  open_timeout=15,
                  close_timeout=5,
                  ping_interval=None,
                  max_size=16*1024*1024,
              ) as ws:
                  first=await asyncio.wait_for(ws.recv(),10)
                  print('OPEN',repr(first))
                  if first!='o': raise SystemExit('SockJS did not open')
                  anon=cmd(1,{0:0,1:'GBP',2:'en',3:1,4:False,5:0,6:'2.2',7:str(uuid.uuid4()),8:5,9:'GEP-exchange-D~Linux~Browser-3.18|',10:'getClientIdentifier'})
                  await ws.send(json.dumps([anon]))
                  ack=await asyncio.wait_for(ws.recv(),10)
                  print('ANON_ACK',repr(ack[:1000]))
                  # Fetch football hierarchy, but exclude market information to keep it light.
                  hierarchy=cmd(12,{0:301,2:SOCCER_ID,3:False,4:False,5:False,11:True,12:False,14:False})
                  await ws.send(json.dumps([hierarchy]))
                  messages=[]
                  deadline=asyncio.get_running_loop().time()+8
                  while asyncio.get_running_loop().time()<deadline and len(messages)<20000:
                      try: frame=await asyncio.wait_for(ws.recv(),0.8)
                      except asyncio.TimeoutError: continue
                      if frame=='h': continue
                      if frame.startswith('a['):
                          try: items=json.loads(frame[1:])
                          except Exception: items=[]
                          messages.extend(items)
                  labels=[m for m in messages if '/EL/en'+FS in m]
                  event_info=[m for m in messages if '/EEI'+FS in m and '/TAB/' not in m]
                  print('FOOTBALL_MSGS',len(messages),'labels',len(labels),'event_info',len(event_info))
                  for m in labels[-12:]: print('LABEL',repr(m[:500]))
                  for m in event_info[-12:]: print('EEI',repr(m[:700]))
                  if not messages or not labels:
                      raise SystemExit('direct BETDAQ websocket returned no football hierarchy')
          asyncio.run(main())
          PY
