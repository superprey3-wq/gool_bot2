name: BETDAQ public smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betdaq-public-smoke.yml'
  workflow_dispatch:

jobs:
  public-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium
      - name: Probe BETDAQ anonymous market stream directly
        run: |
          python - <<'PY'
          import asyncio
          import json
          import re
          from urllib.request import Request, urlopen
          from playwright.async_api import async_playwright

          SHORT = 'https://betdaq.biz/SAUdLa'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          req = Request(SHORT, headers={'User-Agent': UA, 'Accept-Encoding': 'identity'})
          with urlopen(req, timeout=25) as r:
              target = r.geturl()
          print('BETDAQ_TARGET', target)
          m = re.search(r'-(\d+)(?:[/?#]|$)', target)
          if not m:
              raise SystemExit('could not derive BETDAQ event id')
          event_id = int(m.group(1))
          print('BETDAQ_EVENT_ID', event_id)

          frames = []

          def aapi(msg_id, fields):
              payload = '\x02' + str(msg_id) + '\x01'
              for key, value in fields.items():
                  if isinstance(value, bool):
                      value = 'T' if value else 'F'
                  payload += str(key) + '\x02' + str(value) + '\x02\x01'
              return payload

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage','--disable-gpu'])
                  context = await browser.new_context(locale='en-GB')
                  page = await context.new_page()
                  await page.add_init_script('''
                    (() => {
                      const NativeWS = window.WebSocket;
                      window.__goolSockets = [];
                      class GoolWS extends NativeWS {
                        constructor(...args) {
                          super(...args);
                          window.__goolSockets.push(this);
                        }
                      }
                      GoolWS.CONNECTING = NativeWS.CONNECTING;
                      GoolWS.OPEN = NativeWS.OPEN;
                      GoolWS.CLOSING = NativeWS.CLOSING;
                      GoolWS.CLOSED = NativeWS.CLOSED;
                      window.WebSocket = GoolWS;
                    })();
                  ''')

                  def on_ws(ws):
                      print('BETDAQ_WS', ws.url)
                      def sent(payload):
                          text = payload.decode('utf-8','replace') if isinstance(payload, bytes) else str(payload)
                          frames.append(('sent', text))
                          print('SENT', repr(text[:3000]))
                      def recv(payload):
                          text = payload.decode('utf-8','replace') if isinstance(payload, bytes) else str(payload)
                          frames.append(('recv', text))
                          if len(frames) < 120:
                              print('RECV', repr(text[:5000]))
                      ws.on('framesent', sent)
                      ws.on('framereceived', recv)
                  page.on('websocket', on_ws)

                  resp = await page.goto(target, wait_until='domcontentloaded', timeout=45000)
                  print('PAGE', None if resp is None else resp.status, page.url)
                  await page.wait_for_timeout(3000)

                  # Wait until the public anonymous session context was accepted.
                  for _ in range(20):
                      ok = await page.evaluate('''() => window.__goolSockets && window.__goolSockets.some(s => s.readyState === 1)''')
                      if ok and any(side == 'recv' and 'AAPI/1/D' in text for side,text in frames):
                          break
                      await page.wait_for_timeout(500)

                  commands = [
                      # Event hierarchy including market/selection information.
                      aapi(12, {0:100, 2:event_id, 3:False, 4:True, 5:False, 11:False, 12:True, 14:False}),
                      # Market information under this event.
                      aapi(9, {0:101, 2:event_id, 5:True, 7:False, 8:True, 9:True, 12:False}),
                      # Detailed back/lay ladders for markets under this event.
                      aapi(10, {0:102, 1:event_id, 4:False, 6:3, 7:3, 8:0, 11:False}),
                      # Per-market matched amounts.
                      aapi(14, {0:103, 1:event_id, 4:False, 7:False}),
                      # Event-level matched amount.
                      aapi(15, {0:104, 1:event_id, 2:False, 4:False}),
                  ]
                  print('BETDAQ_COMMANDS', len(commands))
                  for cmd in commands:
                      # SockJS native websocket transport expects an array of app messages.
                      await page.evaluate('''cmd => {
                        const s = window.__goolSockets.find(x => x.readyState === 1);
                        if (!s) throw new Error('no open websocket');
                        s.send(JSON.stringify([cmd]));
                      }''', cmd)
                      await page.wait_for_timeout(700)

                  await page.wait_for_timeout(7000)
                  received = [text for side,text in frames if side == 'recv']
                  material = [x for x in received if 'AAPI/' in x and len(x) > 100]
                  print('BETDAQ_RECEIVED', len(received), 'material=', len(material))
                  for x in material[:50]:
                      print('MATERIAL', repr(x[:7000]))

                  await context.close()
                  await browser.close()

              # More than just anonymous-context and ping acknowledgements.
              useful = [x for x in material if not ('AAPI/1/D' in x and ('\x0222\x02' in x or '\x021\x02' in x))]
              print('BETDAQ_USEFUL', len(useful))
              if not useful:
                  raise SystemExit('BETDAQ anonymous subscriptions returned no market payload')

          asyncio.run(main())
          PY
