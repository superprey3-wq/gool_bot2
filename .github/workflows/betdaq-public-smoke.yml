name: BETDAQ public smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betdaq-public-smoke.yml'
      - 'src/gool_bot2/betdaq_exchange.py'
      - 'src/gool_bot2/betdaq_production.py'
      - 'src/gool_bot2/betdaq_market_worker.py'
      - 'src/gool_bot2/betdaq_runtime.py'
      - 'src/gool_bot2/multi_betdaq_money_flow.py'
      - 'tests/test_betdaq_live_decoder.py'
      - 'monkey_start.py'
  workflow_dispatch:

jobs:
  public-board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run real production BETDAQ bootstrap
        env:
          REPORT_TIMEZONE: Europe/Moscow
        run: |
          python - <<'PY'
          import asyncio
          import random
          import string
          import uuid
          from pathlib import Path

          import websockets

          from gool_bot2.betdaq_production import ProductionBetdaqExchangeCollector

          async def main():
              collector = ProductionBetdaqExchangeCollector(Path('/tmp/betdaq-public-smoke.json'))
              server = f"{random.randrange(1000):03d}"
              session = ''.join(random.choice(string.ascii_lowercase + string.digits) for _ in range(8))
              uri = f"wss://aapi-service.betdaq.com/AAPI/{server}/{session}/websocket"
              async with websockets.connect(
                  uri,
                  origin='https://www.betdaq.com',
                  user_agent_header='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
                  open_timeout=15,
                  close_timeout=5,
                  ping_interval=None,
                  max_size=16 * 1024 * 1024,
              ) as ws:
                  first = await asyncio.wait_for(ws.recv(), 10)
                  if first != 'o':
                      raise SystemExit(f'BETDAQ SockJS did not open: {first!r}')
                  await collector._send(
                      ws,
                      1,
                      {
                          0: 0,
                          1: 'GBP',
                          2: 'en',
                          3: 1,
                          4: False,
                          5: 0,
                          6: '2.2',
                          7: str(uuid.uuid4()),
                          8: 5,
                          9: 'GEP-exchange-D~Linux~Browser-3.18|',
                          10: 'getClientIdentifier',
                      },
                  )
                  await collector._recv_for(ws, 1.0)
                  events = await collector._bootstrap(ws)
                  state = collector._build_state(events)
                  print(
                      'BETDAQ_PRODUCTION_SMOKE',
                      'events=', len(events),
                      'markets=', state.get('tracked_markets'),
                      'match_odds=', state.get('tracked_match_odds_markets'),
                      'totals=', state.get('tracked_total_markets'),
                      'events_with_totals=', state.get('events_with_totals'),
                  )
                  for row in events[:10]:
                      print('EVENT', row['event_id'], row['start'].isoformat(), row['name'])
                  if not events:
                      raise SystemExit('production bootstrap returned zero football events')
                  if int(state.get('tracked_total_markets') or 0) <= 0:
                      raise SystemExit('production bootstrap returned zero goal-total markets')

          asyncio.run(main())
          PY
