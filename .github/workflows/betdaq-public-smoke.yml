name: BETDAQ public smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betdaq-public-smoke.yml'
  workflow_dispatch:

jobs:
  public-board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'websockets>=15,<16'
      - name: Identify BETDAQ football market types
        run: |
          python - <<'PY'
          import asyncio, json, random, re, string, uuid
          import websockets

          EVENT_ID=15088496
          RS='\x01'; FS='\x02'
          def cmd(mid, fields):
              out=FS+str(mid)+RS
              for k,v in fields.items():
                  if isinstance(v,bool): v='T' if v else 'F'
                  out += str(k)+FS+str(v)+FS+RS
              return out
          def attrs(msg):
              try: _,tail=msg.split(FS,1)
              except ValueError: return {}
              out={}
              for part in tail.split(RS):
                  if FS not in part: continue
                  k,v=part.split(FS,1)
                  if k.isdigit(): out[int(k)]=v
              return out
          def market_id(topic):
              m=re.search(r'/M/E_(\d+)',topic)
              return int(m.group(1)) if m else None
          async def recv_for(ws, seconds, limit=20000):
              out=[]; loop=asyncio.get_running_loop(); deadline=loop.time()+seconds
              while loop.time()<deadline and len(out)<limit:
                  try: frame=await asyncio.wait_for(ws.recv(),0.5)
                  except asyncio.TimeoutError: continue
                  if frame.startswith('a['):
                      try: out.extend(json.loads(frame[1:]))
                      except Exception: pass
              return out
          async def main():
              uri=f"wss://aapi-service.betdaq.com/AAPI/{random.randrange(1000):03d}/{''.join(random.choice(string.ascii_lowercase+string.digits) for _ in range(8))}/websocket"
              async with websockets.connect(uri,origin='https://www.betdaq.com',user_agent_header='Mozilla/5.0 Chrome/140',open_timeout=15,close_timeout=5,ping_interval=None,max_size=16*1024*1024) as ws:
                  assert await asyncio.wait_for(ws.recv(),10)=='o'
                  await ws.send(json.dumps([cmd(1,{0:0,1:'GBP',2:'en',3:1,4:False,5:0,6:'2.2',7:str(uuid.uuid4()),8:5,9:'GEP-exchange-D~Linux~Browser-3.18|',10:'getClientIdentifier'})]))
                  await asyncio.wait_for(ws.recv(),10)
                  # Event hierarchy: markets yes, selections no, no tabs. One event only.
                  await ws.send(json.dumps([cmd(12,{0:301,2:EVENT_ID,3:False,4:False,5:False,8:True,11:False,12:False,13:False,14:False})]))
                  msgs=await recv_for(ws,6)
                  names={}; types={}
                  for msg in msgs:
                      topic=msg.split(FS,1)[0]; mid=market_id(topic)
                      if not mid: continue
                      a=attrs(msg)
                      if topic.endswith('/ML/en') or topic.endswith('/MEI/MEL/en'):
                          if 1 in a: names[mid]=a[1].strip()
                      elif topic.endswith('/MEI'):
                          try: types[mid]=int(a.get(2))
                          except Exception: pass
                  rows=[]
                  for mid,name in names.items():
                      text=name.casefold()
                      if any(x in text for x in ('match odds','over/under','over under','total goal','1st half','first half')):
                          rows.append((types.get(mid),mid,name))
                  for row in sorted(rows,key=lambda x:(x[0] or 9999,x[2])): print('TYPE',*row)
                  wanted=[r for r in rows if r[2].casefold()=='match odds']
                  totals=[r for r in rows if 'over/under' in r[2].casefold() or 'over under' in r[2].casefold()]
                  print('MATCH_ODDS',wanted)
                  print('TOTALS',totals)
                  if not wanted or not totals: raise SystemExit('required football market types not found')
          asyncio.run(main())
          PY
