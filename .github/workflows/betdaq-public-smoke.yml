name: BETDAQ public smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betdaq-public-smoke.yml'
  workflow_dispatch:

jobs:
  public-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium
      - name: Capture anonymous BETDAQ exchange network payloads
        run: |
          python - <<'PY'
          import asyncio
          import json
          import re
          from playwright.async_api import async_playwright

          URL = 'https://www.betdaq.com/exchange/soccer/english-soccer/premier-league-8531709'
          interesting = []

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage','--disable-gpu'])
                  context = await browser.new_context(locale='en-GB')
                  page = await context.new_page()

                  async def inspect_response(response):
                      url = response.url
                      low = url.lower()
                      if not any(token in low for token in ('betdaq.com', 'webservice', 'datasite', '/api/', 'price', 'market')):
                          return
                      if url.endswith(('.js','.css','.png','.jpg','.jpeg','.svg','.woff','.woff2','.ico')):
                          return
                      try:
                          ctype = (await response.header_value('content-type') or '').lower()
                      except Exception:
                          ctype = ''
                      record = (response.status, ctype, url)
                      if record not in interesting:
                          interesting.append(record)
                          print('BETDAQ_NET', response.status, ctype[:70], url[:500])
                      if response.status != 200 or not any(x in ctype for x in ('json','text','javascript','xml')):
                          return
                      try:
                          body = await response.text()
                      except Exception:
                          return
                      low_body = body.lower()
                      if not any(x in low_body for x in ('matchedamount','matched_amount','matched', 'availableamount','price','marketid','selectionid')):
                          return
                      clean = re.sub(r'\s+', ' ', body)
                      for needle in ('matchedamount', 'matched', 'availableamount', 'marketid', 'selectionid'):
                          pos = clean.lower().find(needle)
                          if pos >= 0:
                              print('BETDAQ_PAYLOAD', needle, clean[max(0,pos-180):pos+700][:1000])
                              break

                  page.on('response', lambda response: asyncio.create_task(inspect_response(response)))
                  response = await page.goto(URL, wait_until='domcontentloaded', timeout=45000)
                  print('BETDAQ_PAGE_STATUS', None if response is None else response.status)
                  await page.wait_for_timeout(12000)
                  text = await page.locator('body').inner_text(timeout=10000)
                  print('BETDAQ_BODY_LEN', len(text))
                  for needle in ('Matched:', 'Matched', 'Back', 'Lay'):
                      pos = text.find(needle)
                      print('BETDAQ_BODY_TOKEN', needle, pos)
                      if pos >= 0:
                          print('BETDAQ_BODY_SNIP', re.sub(r'\s+', ' ', text[max(0,pos-250):pos+900])[:1200])
                  print('BETDAQ_INTERESTING_COUNT', len(interesting))
                  await context.close()
                  await browser.close()

              if not interesting:
                  raise SystemExit('no BETDAQ network traffic captured')

          asyncio.run(main())
          PY
