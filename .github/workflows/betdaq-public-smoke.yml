name: BETDAQ public smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betdaq-public-smoke.yml'
  workflow_dispatch:

jobs:
  public-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium
      - name: Capture anonymous BETDAQ market subscriptions
        run: |
          python - <<'PY'
          import asyncio
          import re
          from playwright.async_api import async_playwright

          URL = 'https://www.betdaq.com/exchange/soccer/english-soccer/premier-league-8531709'
          sockets = []
          frames = []

          def compact(value, limit=1800):
              if isinstance(value, bytes):
                  try:
                      value = value.decode('utf-8', errors='replace')
                  except Exception:
                      return f'<bytes {len(value)}>'
              return re.sub(r'\s+', ' ', str(value))[:limit]

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage','--disable-gpu'])
                  context = await browser.new_context(locale='en-GB')
                  page = await context.new_page()

                  async def inspect_response(response):
                      low = response.url.lower()
                      if 'aapi-service.betdaq.com' in low or 'webservice.betdaq.com' in low:
                          try:
                              ctype = await response.header_value('content-type') or ''
                          except Exception:
                              ctype = ''
                          print('BETDAQ_API_RESPONSE', response.status, ctype, response.url[:700])
                          if response.status == 200:
                              try:
                                  body = await response.text()
                                  print('BETDAQ_API_BODY', compact(body))
                              except Exception as exc:
                                  print('BETDAQ_API_BODY_ERROR', type(exc).__name__, str(exc))

                  def on_ws(ws):
                      sockets.append(ws.url)
                      print('BETDAQ_WS_OPEN', ws.url[:800])

                      def sent(payload):
                          text = compact(payload)
                          frames.append(('sent', text))
                          if len(frames) <= 220:
                              print('BETDAQ_WS_SENT', text)

                      def received(payload):
                          text = compact(payload)
                          frames.append(('recv', text))
                          if len(frames) <= 300:
                              print('BETDAQ_WS_RECV', text)

                      ws.on('framesent', sent)
                      ws.on('framereceived', received)
                      ws.on('close', lambda: print('BETDAQ_WS_CLOSE', ws.url[:500]))

                  page.on('websocket', on_ws)
                  page.on('response', lambda response: asyncio.create_task(inspect_response(response)))

                  response = await page.goto(URL, wait_until='domcontentloaded', timeout=45000)
                  print('BETDAQ_PAGE_STATUS', None if response is None else response.status)
                  await page.wait_for_timeout(2500)

                  accepted = False
                  for label in ('Accept All', 'Manage Neccessary Only'):
                      try:
                          button = page.get_by_role('button', name=label, exact=True)
                          if await button.count():
                              await button.first.click(timeout=5000)
                              accepted = True
                              print('BETDAQ_COOKIE_CLICK', label)
                              break
                      except Exception as exc:
                          print('BETDAQ_COOKIE_CLICK_ERROR', label, type(exc).__name__, str(exc)[:200])
                  if not accepted:
                      try:
                          await page.get_by_text('Accept All', exact=True).first.click(timeout=5000)
                          accepted = True
                          print('BETDAQ_COOKIE_CLICK text=Accept All')
                      except Exception as exc:
                          print('BETDAQ_COOKIE_NOT_CLICKED', type(exc).__name__, str(exc)[:250])

                  await page.wait_for_timeout(18000)
                  text = await page.locator('body').inner_text(timeout=10000)
                  print('BETDAQ_BODY_LEN', len(text))
                  print('BETDAQ_SOCKETS', len(sockets))
                  print('BETDAQ_FRAMES', len(frames))
                  print('BETDAQ_BODY', compact(text, 3500))

                  sent = [x for side, x in frames if side == 'sent']
                  recv = [x for side, x in frames if side == 'recv']
                  # Market subscriptions are materially larger/different than the
                  # initial client id + clock handshake. Report frame lengths too.
                  print('BETDAQ_SENT_LENGTHS', [len(x) for x in sent[:40]])
                  print('BETDAQ_RECV_LENGTHS', [len(x) for x in recv[:80]])
                  marketish = [
                      x for x in sent + recv
                      if any(token in x.lower() for token in ('market','selection','price','matched','event'))
                         or len(x) > 250
                  ]
                  print('BETDAQ_MARKETISH_FRAMES', len(marketish))
                  for row in marketish[:50]:
                      print('BETDAQ_MARKETISH', row)

                  await context.close()
                  await browser.close()

              if len(frames) <= 5:
                  raise SystemExit('BETDAQ stayed at handshake only; no anonymous market subscription observed')

          asyncio.run(main())
          PY
