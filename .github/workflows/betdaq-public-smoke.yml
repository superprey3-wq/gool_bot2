name: BETDAQ public smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betdaq-public-smoke.yml'
  workflow_dispatch:

jobs:
  public-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium
      - name: Capture BETDAQ Match Odds price and volume payload
        run: |
          python - <<'PY'
          import asyncio
          import json
          import re
          from urllib.request import Request, urlopen
          from playwright.async_api import async_playwright

          SHORT = 'https://betdaq.biz/SAUdLa'
          MATCH_ODDS = 52667628
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          req = Request(SHORT, headers={'User-Agent': UA, 'Accept-Encoding': 'identity'})
          with urlopen(req, timeout=25) as r:
              target = r.geturl()
          print('TARGET', target, 'MATCH_ODDS', MATCH_ODDS)

          def aapi(msg_id, fields):
              payload = '\x02' + str(msg_id) + '\x01'
              for key, value in fields.items():
                  if isinstance(value, bool):
                      value = 'T' if value else 'F'
                  payload += str(key) + '\x02' + str(value) + '\x02\x01'
              return payload

          frames = []
          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage','--disable-gpu'])
                  context = await browser.new_context(locale='en-GB')
                  page = await context.new_page()
                  await page.add_init_script('''
                    (() => { const N=window.WebSocket; window.__goolSockets=[];
                      class G extends N { constructor(...a){super(...a);window.__goolSockets.push(this);} }
                      G.CONNECTING=N.CONNECTING;G.OPEN=N.OPEN;G.CLOSING=N.CLOSING;G.CLOSED=N.CLOSED;window.WebSocket=G; })();
                  ''')
                  def on_ws(ws):
                      def recv(payload):
                          text = payload.decode('utf-8','replace') if isinstance(payload, bytes) else str(payload)
                          frames.append(text)
                      ws.on('framereceived', recv)
                  page.on('websocket', on_ws)
                  await page.goto(target, wait_until='domcontentloaded', timeout=45000)
                  for _ in range(30):
                      if any('AAPI/1/D' in x for x in frames):
                          break
                      await page.wait_for_timeout(300)

                  before = len(frames)
                  cmds = [
                      aapi(9, {0:201, 6:str(MATCH_ODDS), 7:False, 8:True, 9:True, 12:False}),
                      aapi(10,{0:202, 5:str(MATCH_ODDS), 6:3, 7:3, 8:0, 11:False}),
                      aapi(14,{0:203, 5:str(MATCH_ODDS), 7:False}),
                      aapi(13,{0:204, 5:str(MATCH_ODDS), 7:False}),
                  ]
                  for cmd in cmds:
                      await page.evaluate('''cmd => { const s=window.__goolSockets.find(x=>x.readyState===1); if(!s) throw new Error('no ws'); s.send(JSON.stringify([cmd])); }''', cmd)
                      await page.wait_for_timeout(600)
                  await page.wait_for_timeout(5000)

                  fresh = frames[before:]
                  print('FRESH_COUNT', len(fresh))
                  selected = []
                  for text in fresh:
                      if str(MATCH_ODDS) in text or any(tok in text for tok in ('AAPI/1/D','AAPI/1/M','AAPI/1/S')):
                          selected.append(text)
                  print('SELECTED_COUNT', len(selected))
                  seen_topics = set()
                  for text in selected[:160]:
                      # SockJS frame contains one or more JSON-escaped AAPI messages.
                      try:
                          if text.startswith('a['):
                              msgs = json.loads(text[1:])
                          else:
                              msgs = [text]
                      except Exception:
                          msgs = [text]
                      for msg in msgs:
                          topic = msg.split('\x02',1)[0]
                          if topic not in seen_topics:
                              seen_topics.add(topic)
                              print('TOPIC', topic)
                          print('PAYLOAD', repr(msg[:5000]))
                  print('TOPIC_COUNT', len(seen_topics))
                  await context.close(); await browser.close()

              if not any(str(MATCH_ODDS) in x for x in fresh):
                  raise SystemExit('no Match Odds payload returned')

          asyncio.run(main())
          PY
