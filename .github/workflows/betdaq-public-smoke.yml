name: BETDAQ public smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betdaq-public-smoke.yml'
  workflow_dispatch:

jobs:
  public-board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'websockets>=15,<16'
      - name: Probe BETDAQ today event matched volumes
        run: |
          python - <<'PY'
          import asyncio, json, random, re, string, uuid
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import websockets

          SOCCER_ID=100003; RS='\x01'; FS='\x02'; TZ=ZoneInfo('Europe/Moscow')
          def cmd(mid, fields):
              out=FS+str(mid)+RS
              for k,v in fields.items():
                  if isinstance(v,bool): v='T' if v else 'F'
                  out += str(k)+FS+str(v)+FS+RS
              return out
          def attrs(msg):
              try: _,tail=msg.split(FS,1)
              except ValueError: return {}
              out={}
              for part in tail.split(RS):
                  if FS not in part: continue
                  k,v=part.split(FS,1)
                  if k.isdigit(): out[int(k)]=v
              return out
          def eid(topic):
              vals=re.findall(r'/E/E_(\d+)',topic)
              return int(vals[-1]) if vals else None
          async def recv_for(ws, seconds, limit=30000):
              out=[]; deadline=asyncio.get_running_loop().time()+seconds
              while asyncio.get_running_loop().time()<deadline and len(out)<limit:
                  try: frame=await asyncio.wait_for(ws.recv(),0.65)
                  except asyncio.TimeoutError: continue
                  if frame=='h': continue
                  if frame.startswith('a['):
                      try: out.extend(json.loads(frame[1:]))
                      except Exception: pass
              return out

          async def main():
              uri=f"wss://aapi-service.betdaq.com/AAPI/{random.randrange(1000):03d}/{''.join(random.choice(string.ascii_lowercase+string.digits) for _ in range(8))}/websocket"
              async with websockets.connect(uri,origin='https://www.betdaq.com',user_agent_header='Mozilla/5.0 Chrome/140',open_timeout=15,close_timeout=5,ping_interval=None,max_size=16*1024*1024) as ws:
                  assert await asyncio.wait_for(ws.recv(),10)=='o'
                  await ws.send(json.dumps([cmd(1,{0:0,1:'GBP',2:'en',3:1,4:False,5:0,6:'2.2',7:str(uuid.uuid4()),8:5,9:'GEP-exchange-D~Linux~Browser-3.18|',10:'getClientIdentifier'})]))
                  await asyncio.wait_for(ws.recv(),10)
                  await ws.send(json.dumps([cmd(12,{0:301,2:SOCCER_ID,3:False,4:False,5:False,11:True,12:False,14:False})]))
                  msgs=await recv_for(ws,5)
                  labels={}; starts={}
                  for m in msgs:
                      topic=m.split(FS,1)[0]; event=eid(topic)
                      if not event: continue
                      a=attrs(m)
                      if topic.endswith('/EL/en') and 1 in a: labels[event]=a[1].strip()
                      if topic.endswith('/EEI') and 3 in a: starts[event]=a[3]
                  target_date=datetime.now(TZ).date()
                  today=[]
                  for event,raw in starts.items():
                      try: dt=datetime.fromisoformat(raw.replace('Z','+00:00'))
                      except Exception: continue
                      if dt.astimezone(TZ).date()==target_date and event in labels:
                          today.append((event,labels[event],dt))
                  print('TODAY_COUNT',len(today),'date',target_date)
                  for row in sorted(today,key=lambda x:x[2])[:30]: print('TODAY',row[0],row[2].isoformat(),row[1])
                  if not today: raise SystemExit('no today events')

                  # Event-level matched amount subscription for soccer root and for today's events.
                  await ws.send(json.dumps([cmd(15,{0:401,1:SOCCER_ID,2:False,4:False})]))
                  for i,(event,_,_) in enumerate(today[:120],start=500):
                      await ws.send(json.dumps([cmd(15,{0:i,1:event,2:False,4:False})]))
                  vols=await recv_for(ws,6,50000)
                  matched=[]
                  for m in vols:
                      topic=m.split(FS,1)[0]
                      if '/EMA/' not in topic and '/MMA/' not in topic: continue
                      a=attrs(m); event=eid(topic)
                      if event and event in labels:
                          matched.append((event,labels[event],topic,a))
                  print('MATCHED_TOPICS',len(matched))
                  seen={}
                  for event,name,topic,a in matched:
                      vals=[]
                      for k in (1,2):
                          try: vals.append(float(a.get(k,0) or 0))
                          except Exception: vals.append(0.0)
                      score=max(vals) if vals else 0.0
                      if score>=seen.get(event,(-1,None,None))[0]: seen[event]=(score,topic,a)
                  ranked=sorted(((v[0],e,labels[e],v[1],v[2]) for e,v in seen.items() if e in {x[0] for x in today}),reverse=True)
                  for score,event,name,topic,a in ranked[:15]: print('VOL',event,name,'score',score,'topic',topic,'attrs',a)
                  if not ranked: raise SystemExit('no event matched volume for today')
          asyncio.run(main())
          PY
