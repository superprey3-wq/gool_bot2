name: BETDAQ public smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betdaq-public-smoke.yml'
  workflow_dispatch:

jobs:
  public-board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect BETDAQ anonymous streaming field layout
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request, urlopen

          URL = 'https://www.betdaq.com/dist/prodgec.js?ver=3.18/'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          req = Request(URL, headers={'User-Agent': UA, 'Accept-Encoding': 'identity'})
          with urlopen(req, timeout=25) as r:
              body = r.read().decode('utf-8', errors='ignore')
              print('FETCH', r.status, len(body))

          needles = [
              't.aapiId={',
              'setAnonymousSessionContext=function',
              'setAnonymousSessionContext',
              'subscribeDetailedMarketPrices=function',
              'subscribeMarketMatchedAmounts=function',
              'subscribeEventMatchedAmounts=function',
              '_sendStreamingMessage=function',
              'sendStreamingMessage',
              'addToPushMessages',
              'getClientIdentifier'
          ]
          hits = 0
          low = body.lower()
          for needle in needles:
              pos = low.find(needle.lower())
              if pos < 0:
                  print('MISS', needle)
                  continue
              hits += 1
              snip = re.sub(r'\s+', ' ', body[max(0,pos-1800):pos+5200])
              print('LAYOUT_HIT', needle)
              print('LAYOUT_SNIP', snip[:7000])
          print('LAYOUT_HITS', hits)
          if hits < 6:
              raise SystemExit('not enough field-layout clues found')
          PY
