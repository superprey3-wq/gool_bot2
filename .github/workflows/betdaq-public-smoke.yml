name: BETDAQ public smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betdaq-public-smoke.yml'
  workflow_dispatch:

jobs:
  public-board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect BETDAQ public football pages without login
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          ROOT = 'https://www.betdaq.com/'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          def fetch(url):
              req = Request(url, headers={'User-Agent': UA, 'Accept': 'text/html,application/xhtml+xml,*/*', 'Accept-Encoding': 'identity'})
              with urlopen(req, timeout=20) as r:
                  body = r.read().decode('utf-8', errors='ignore')
                  print('BETDAQ_FETCH', r.status, len(body), url)
                  return body

          def links(body):
              out = []
              for href in re.findall(r'href=["\']([^"\']+)["\']', body, flags=re.I):
                  url = urljoin(ROOT, href)
                  if '/exchange/soccer/' in url and url not in out:
                      out.append(url)
              return out

          home = fetch(ROOT)
          leagues = links(home)
          print('BETDAQ_LEAGUES', len(leagues))
          event_links = []
          readable = []

          for league in leagues[:6]:
              body = fetch(league)
              low = body.lower()
              print('BETDAQ_TOKENS', league, 'matched=', low.count('matched'), 'market=', low.count('market'), 'back=', low.count('back'), 'lay=', low.count('lay'))
              for needle in ('matched', 'matchedamount', 'matched_amount', 'totalmatched', 'availableamount', 'available-amount'):
                  pos = low.find(needle)
                  if pos >= 0:
                      print('BETDAQ_SNIP', needle, re.sub(r'\s+', ' ', body[max(0,pos-180):pos+360])[:700])
              for url in links(body):
                  if url != league and url not in event_links:
                      event_links.append(url)
              # Common embedded data/API clues.
              for pattern in (r'https?://[^"\'<> ]+', r'/api/[^"\'<> ]+', r'/[^"\'<> ]*(?:market|price|event)[^"\'<> ]*'):
                  hits = re.findall(pattern, body, flags=re.I)
                  for hit in hits[:20]:
                      if any(x in hit.lower() for x in ('api', 'market', 'price', 'event')):
                          print('BETDAQ_CLUE', hit[:300])

          print('BETDAQ_EVENT_LINKS', len(event_links))
          for url in event_links[:10]:
              print('BETDAQ_EVENT_LINK', url)

          for url in event_links[:8]:
              try:
                  body = fetch(url)
              except Exception as exc:
                  print('BETDAQ_EVENT_ERROR', type(exc).__name__, str(exc), url)
                  continue
              low = body.lower()
              vals = re.findall(r'Matched\s*:\s*£\s*([0-9][0-9,]*(?:\.\d+)?)', body, flags=re.I)
              print('BETDAQ_EVENT_TOKENS', 'matched=', low.count('matched'), 'back=', low.count('back'), 'lay=', low.count('lay'), url)
              if vals:
                  readable.append((url, vals[:10]))
                  print('BETDAQ_MATCHED', url, vals[:10])
              else:
                  pos = low.find('matched')
                  if pos >= 0:
                      print('BETDAQ_EVENT_SNIP', re.sub(r'\s+', ' ', body[max(0,pos-220):pos+500])[:900])

          # Even if the values are client-rendered, a successful probe means the
          # server can reach BETDAQ and we have payload clues for the next adapter.
          if not leagues:
              raise SystemExit('BETDAQ homepage exposed no soccer exchange links')
          print('BETDAQ_SMOKE_REACHABLE leagues=', len(leagues), 'events=', len(event_links), 'readable_matched=', len(readable))
          PY
