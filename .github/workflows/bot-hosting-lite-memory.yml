name: GOOL Lite football-only CI

on:
  workflow_dispatch:
  push:
    branches: [bot-hosting-lite]
    paths:
      - "bot_hosting_lite.py"
      - "src/gool_bot2/**"
      - "tests/test_lite_football.py"
      - "tests/test_lite_football_service.py"
      - "tests/test_lite_original_football.py"
      - "scripts/football_only_probe.py"
      - ".github/workflows/bot-hosting-lite-memory.yml"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  football-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only Bot-Hosting Lite requirements and pytest
        run: python -m pip install --no-cache-dir -r requirements.txt pytest
      - name: Check unchanged GOOL V5 and LIVE V4 engines, real price gates, settlement
        env:
          GOOL_FOOTBALL_AUTOINSTALL: "0"
          PYTHONPATH: "src"
        run: |
          python -m pytest -q tests/test_lite_football.py tests/test_lite_football_service.py tests/test_lite_original_football.py tests/test_prematch_strategy_scenarios.py tests/test_live_goal_brain_v4.py
      - name: One-shot Flashscore + original Football V5 real-data source diagnostic
        continue-on-error: true
        timeout-minutes: 3
        env:
          GOOL_FOOTBALL_AUTOINSTALL: "0"
          PYTHONPATH: "src"
        run: python scripts/football_only_probe.py
      - name: One-process no-network memory smoke
        env:
          GOOL_FOOTBALL_AUTOINSTALL: "0"
          GOOL_FOOTBALL_LITE_MODE: "shadow"
          GOOL_BROWSER_ENABLE: "0"
        run: |
          python bot_hosting_lite.py --smoke
          python -m compileall -q bot_hosting_lite.py src/gool_bot2/lite_football*.py
