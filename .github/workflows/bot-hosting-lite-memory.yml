name: Bot-Hosting Lite memory feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - bot-hosting-lite
    paths:
      - "scripts/bot_hosting_memory_probe.py"
      - "bot_hosting_lite.py"
      - "tests/test_lite_football.py"
      - "requirements-lite.txt"
      - ".github/workflows/bot-hosting-lite-memory.yml"
      - "src/gool_bot2/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  measure-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared GOOL runtime dependencies
        run: python -m pip install -e .
      - name: Measure actual interpreter and module import memory
        run: python scripts/bot_hosting_memory_probe.py
      - name: Validate scenario and sports logic without football model hooks
        env:
          GOOL_FOOTBALL_AUTOINSTALL: "0"
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_prematch_strategy_scenarios.py \
            tests/test_prematch_scenario_active.py \
            tests/test_hockey_brain_v2.py \
            tests/test_basketball_brain_v2.py \
            tests/test_lite_football.py
      - name: Start GOOL Lite without secrets or network calls
        env:
          GOOL_FOOTBALL_AUTOINSTALL: "0"
        run: |
          python bot_hosting_lite.py --smoke
      - name: Save memory report
        uses: actions/upload-artifact@v4
        with:
          name: gool-bot-hosting-import-memory
          path: reports/bot_hosting_lite/import_memory.json
          retention-days: 14

  lite-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only lightweight runtime dependencies
        run: python -m pip install -r requirements-lite.txt
      - name: Install offline test runner
        run: python -m pip install pytest
      - name: Test football Lite with minimal dependencies
        env:
          GOOL_FOOTBALL_AUTOINSTALL: "0"
        run: python -m pytest -q tests/test_lite_football.py
      - name: Boot Lite worker from minimal installation
        env:
          GOOL_FOOTBALL_AUTOINSTALL: "0"
        run: python bot_hosting_lite.py --smoke
