name: confidence trim regression

on:
  push:
    paths:
      - "src/gool_bot2/multi_confidence_gate.py"
      - "tests/test_multi_confidence_trim.py"
      - ".github/workflows/confidence-trim-regression.yml"
  pull_request:
    paths:
      - "src/gool_bot2/multi_confidence_gate.py"
      - "tests/test_multi_confidence_trim.py"
      - ".github/workflows/confidence-trim-regression.yml"

jobs:
  confidence-trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff
      - name: Run confidence regressions
        run: |
          pytest -q \
            tests/test_multi_confidence_trim.py \
            tests/test_multi_rating70_epoch.py
      - name: Check changed Python surface
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/gool_bot2/multi_confidence_gate.py \
            tests/test_multi_confidence_trim.py
