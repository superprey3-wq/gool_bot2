name: exchange money flow probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/exchange_money_flow_probe.py'
      - 'scripts/matchbook_football_orderbook_probe.py'
      - '.github/workflows/exchange-money-flow-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe Matchbook football order books
        run: python scripts/matchbook_football_orderbook_probe.py
