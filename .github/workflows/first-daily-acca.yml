name: GOOL first daily accumulator
on:
  workflow_dispatch:
  push:
    branches: [gool-v4-rebuild, fix/xbet-live-index-blackout]
    paths:
      - ".github/workflows/first-daily-acca.yml"
      - "src/gool_bot2/v4_prematch_engine.py"
      - "src/gool_bot2/v4_shadow_report.py"
      - "src/gool_bot2/prematch_goal_profile.py"
      - "src/gool_bot2/providers/prematch_fusion.py"
      - "src/gool_bot2/xbet_prematch_market.py"
      - "src/gool_bot2/xbet_market_pressure.py"
jobs:
  first-acca:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Scan today's field and build first accumulator
        env:
          XBET_PREMATCH_FETCH_EVENTS: "60"
          XBET_PREMATCH_WORKERS: "8"
          XBET_PREMATCH_SEARCH_WORKERS: "12"
          GOOL_PREMATCH_WORKERS: "20"
          GOOL_PREMATCH_PRICE_CAP: "0"
          GOOL_FIXTURE_SOURCE: "flashscore"
        run: python -m gool_bot2.v4_shadow_report --first-acca --limit 30
