name: Football source detail validation
on:
  push:
    branches: [diag/nowgoal-feed-20261126]
    paths: ['.github/workflows/football-detail-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate match records and detailed statistics
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, json, datetime, concurrent.futures, html
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          class Rows(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows=[]
                  self.row=None
                  self.cell=None
                  self.links=[]
                  self.text=[]
                  self.skip=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ("script","style"): self.skip+=1
                  if tag=="tr": self.row={"attrs":a,"cells":[],"links":[]}
                  if tag in ("td","th") and self.row is not None: self.cell=[]
                  if tag=="a" and a.get("href"):
                      self.links.append(a["href"])
                      if self.row is not None: self.row["links"].append(a["href"])
              def handle_data(self,data):
                  if self.skip: return
                  t=" ".join(data.split())
                  if t:
                      self.text.append(t)
                      if self.cell is not None: self.cell.append(t)
              def handle_endtag(self,tag):
                  if tag in ("script","style"): self.skip=max(0,self.skip-1)
                  if tag in ("td","th") and self.row is not None and self.cell is not None:
                      self.row["cells"].append(" ".join(self.cell));self.cell=None
                  if tag=="tr" and self.row is not None:
                      self.rows.append(self.row);self.row=None;self.cell=None
          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":"GOOL-Data-Research/1.0","Accept":"application/json,text/html,*/*"})
              with urllib.request.urlopen(req,timeout=15) as res:
                  return res.read(5000000).decode("utf-8","replace")
          def parse(body):
              p=Rows();p.feed(body);return p
          def run(name):
              out={"source":name}
              try:
                  if name=="nowgoal":
                      base="https://www.nowgoal.net"
                      body=fetch(base+"/ajax/SoccerAjax?type=6&date="+datetime.date.today().isoformat()+"&order=league&timezone=3")
                      out["ajax_prefix"]=body[:1300]
                      out["ajax_json"]=False
                      try:
                          obj=json.loads(body);out["ajax_json"]=True;out["ajax_structure"]=str(type(obj));out["ajax_keys"]=list(obj)[:15] if isinstance(obj,dict) else []
                      except ValueError: pass
                      p=parse(fetch(base+"/"))
                      ids=sorted(set(re.findall(r"/match/h2h-(\d+)"," ".join(p.links))))
                      out["home_h2h_ids"]=len(ids)
                      p=parse(fetch(base+"/match/live-3073720"))
                      out["stat_text_examples"]=[p.text[max(0,i-2):i+3] for i,t in enumerate(p.text) if t.lower() in ("shots on target","shots","dangerous attacks","expected goals (xg)","possession")][:15]
                      p=parse(fetch(base+"/match/h2h-3073720"))
                      out["h2h_row_samples"]=[r["cells"][:12] for r in p.rows if len(r["cells"])>=5][:8]
                  elif name=="totalcorner":
                      base="https://www.totalcorner.com"
                      p=parse(fetch(base+"/match/schedule"))
                      matches=[r for r in p.rows if any(re.search(r"/live/[^?]+/\d+",x) for x in r["links"])]
                      out["match_rows"]=len(matches)
                      out["row_samples"]=[{"cells":r["cells"][:25],"attrs":r["attrs"],"links":r["links"][:4]} for r in matches[:5]]
                      live=[r for r in matches if any(re.fullmatch(r"\d{1,3}(?:\+\d{1,2})?['′’]|HT|Half Time",c,re.I) for c in r["cells"])]
                      out["live_minute_candidates"]=len(live)
                      out["live_samples"]=[r["cells"][:20] for r in live[:3]]
                      if matches:
                          r=(live or matches)[0]
                          path=next(x for x in r["links"] if re.search(r"/live/[^?]+/\d+",x))
                          q=parse(fetch(urljoin(base,path)))
                          out["detail_path"]=path
                          out["detail_stat_examples"]=[q.text[max(0,i-2):i+3] for i,t in enumerate(q.text) if t.lower() in ("shots on target","shots","dangerous attacks","possession","attacks")][:10]
                  elif name=="7msport":
                      p=parse(fetch("https://live.7msport.com/default_en.aspx"))
                      out["row_samples"]=[{"cells":r["cells"][:20],"attrs":r["attrs"],"links":r["links"][:5]} for r in p.rows if len(r["cells"])>=5][:10]
                  elif name=="goaloo":
                      p=parse(fetch("https://live.goaloo.live/football/schedule/today"))
                      out["visible_text_sample"]=p.text[:100]
                      out["links_sample"]=p.links[:20]
                  elif name=="365scores":
                      base="https://webws.365scores.com/web"
                      params="appTypeId=5&langId=14&timezoneName=America/Argentina/Buenos_Aires&userCountryId=31"
                      obj=json.loads(fetch(base+"/games/allscores/?"+params+"&sports=1"))
                      games=[g for g in obj.get("games",[]) if g.get("id") and g.get("homeCompetitor") and g.get("awayCompetitor")]
                      out["all_matches"]=len(games)
                      live=[g for g in games if g.get("statusGroup")==2 or g.get("isLive") is True]
                      out["status_samples"]=[{"id":g["id"],"status":g.get("statusText"),"gameTime":g.get("gameTime"),"statusGroup":g.get("statusGroup"),"home":g["homeCompetitor"].get("name"),"away":g["awayCompetitor"].get("name")} for g in live]
                      candidates=[g for g in live if "sin cobertura" not in str(g.get("statusText","")).lower()][:4]
                      out["detail_checks"]=[]
                      for g in candidates:
                          try:
                              d=json.loads(fetch(base+"/game/stats/?"+params+"&games="+str(g["id"])))
                              out["detail_checks"].append({"id":g["id"],"keys":list(d),"preview":json.dumps(d,ensure_ascii=False)[:1400]})
                          except Exception as e:out["detail_checks"].append({"id":g["id"],"error":str(e)})
              except Exception as e:out["error"]=str(e)
              return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as p:
              for r in p.map(run,["nowgoal","totalcorner","7msport","goaloo","365scores"]):
                  print("DETAIL_RESULT",json.dumps(r,ensure_ascii=False))
          PY
