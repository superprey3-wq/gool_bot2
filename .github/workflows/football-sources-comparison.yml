name: Football public sources comparison
on:
  push:
    branches: [diag/nowgoal-feed-20261126]
    paths: ['.github/workflows/football-sources-comparison.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public football data
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re, concurrent.futures, datetime
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          urls = {
              "nowgoal_home": "https://www.nowgoal.net/",
              "nowgoal_mobile": "https://m.nowgoal.net/",
              "nowgoal_free_widget": "https://free1.nowgoal.plus/free/freesoccer",
              "nowgoal_h2h": "https://www.nowgoal.net/match/h2h-3073720",
              "nowgoal_detail": "https://www.nowgoal.net/match/live-3073720",
              "nowgoal_schedule_ajax": "https://www.nowgoal.net/ajax/SoccerAjax?type=6&date="+datetime.date.today().isoformat()+"&order=league&timezone=3",
              "goaloo_home": "https://live.goaloo903.com/",
              "goaloo_schedule": "https://live.goaloo900.com/football/schedule/today",
              "titan_home": "https://live.titan007.com/",
              "totalcorner_schedule": "https://www.totalcorner.com/match/schedule",
              "365scores_catalog": "https://webws.365scores.com/web/games/allscores/?appTypeId=5&langId=14&timezoneName=America/Argentina/Buenos_Aires&userCountryId=31&sports=1",
              "7msport_live": "https://live.7msport.com/default_en.aspx",
              "statgol_home": "https://statgol.com/en/",
              "asianodds_home": "https://asianodds.com/",
              "betlab_home": "https://betlab.club/",
              "moviodds_public": "https://moviodds.com/odds?sport=soccer&in_play=1&stats=1",
              "triggerstats_live": "https://triggerstats.com/live",
          }
          class Scan(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=set()
                  self.tables=0
                  self.rows=0
                  self.scripts=set()
                  self.text=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="a" and a.get("href"): self.links.add(a["href"])
                  if tag=="script" and a.get("src"): self.scripts.add(a["src"])
                  if tag=="table": self.tables+=1
                  if tag=="tr": self.rows+=1
              def handle_data(self, data):
                  self.text.append(data.strip())
          def request(url):
              req=urllib.request.Request(url,headers={"User-Agent":"GOOL-Data-Research/1.0","Accept":"application/json,text/html,*/*"})
              with urllib.request.urlopen(req,timeout=15) as res:
                  return res.status,res.url,res.headers.get("Content-Type",""),res.read(4000000).decode("utf-8","replace")
          def probe(item):
              name,url=item
              out={"source":name,"url":url,"verified_records":0}
              try:
                  status,final,typ,body=request(url)
                  out.update(http=status,final=final,bytes=len(body),type=typ)
                  try:
                      obj=json.loads(body)
                      out["json_keys"]=list(obj)[:20] if isinstance(obj,dict) else []
                      if name=="365scores_catalog" and isinstance(obj,dict):
                          games=obj.get("games",[])
                          valid=[g for g in games if isinstance(g,dict) and g.get("id") and g.get("homeCompetitor") and g.get("awayCompetitor")]
                          live=[g for g in valid if g.get("isLive") is True or g.get("statusGroup")==2]
                          out.update(verified_records=len(valid),live_candidates=len(live),sample=[{"id":g.get("id"),"home":g["homeCompetitor"].get("name"),"away":g["awayCompetitor"].get("name"),"status":g.get("statusText"),"statusGroup":g.get("statusGroup")} for g in (live or valid)[:3]])
                          if live or valid:
                              gid=(live or valid)[0]["id"]
                              try:
                                  _,_,_,raw=request("https://webws.365scores.com/web/game/stats/?appTypeId=5&langId=14&timezoneName=America/Argentina/Buenos_Aires&userCountryId=31&games="+str(gid))
                                  stats=json.loads(raw)
                                  out["detail_probe"]={"match_id":gid,"keys":list(stats)[:20],"preview":json.dumps(stats,ensure_ascii=False)[:1000]}
                              except Exception as e: out["detail_error"]=str(e)
                      else:
                          out["json_preview"]=json.dumps(obj,ensure_ascii=False)[:600]
                  except (ValueError,TypeError):
                      scan=Scan()
                      scan.feed(body)
                      matchlinks=[x for x in scan.links if re.search(r'/match/(?:live|h2h)-\d+|/live/[^?]+/\d+|/match/[^?]+/\d+',x)]
                      ids=set()
                      for link in matchlinks:
                          m=re.search(r'(\d{5,})(?:[/?#]|$)',link)
                          if m: ids.add(m.group(1))
                      visible=" ".join(scan.text)
                      out.update(html_title=re.sub(r'\s+',' ',re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S).group(1)).strip() if re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S) else "",tables=scan.tables,table_rows=scan.rows,match_link_ids=len(ids),match_link_samples=sorted(matchlinks)[:3],loading_placeholder="loading..." in visible.lower(),stat_labels=[s for s in ["Shots on Target","Dangerous Attacks","Possession","Expected Goals","Goal Distribution"] if s.lower() in visible.lower()])
                      if name.startswith("nowgoal"): out["script_samples"]=sorted(scan.scripts)[:10]
                      if name=="totalcorner_schedule": out["match_detail_links"]=sorted(x for x in scan.links if re.search(r'/match/stats/|/live/|/odds/',x))[:5]
              except urllib.error.HTTPError as e:
                  out.update(http=e.code,error=str(e))
              except Exception as e:
                  out["error"]=str(e)
              return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              results=list(pool.map(probe,urls.items()))
          for item in results: print("SOURCE_RESULT",json.dumps(item,ensure_ascii=False))
          print("DIAGNOSTIC_COMPLETE",len(results),"sources; verified JSON records",sum(x["verified_records"] for x in results))
          PY
