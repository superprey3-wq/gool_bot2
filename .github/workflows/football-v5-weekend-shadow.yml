name: Football V5 weekend shadow 2026-10-10/11

on:
  push:
    branches:
      - main
      - feature/football-v5-weekend-shadow-20261010
    paths:
      - src/gool_bot2/football_v5_shadow.py
      - src/gool_bot2/v4_shadow_report.py
      - scripts/gool_flashscore_today.py
      - scripts/gool_football_v5_weekend.py
      - tests/test_football_v5_shadow.py
      - .github/workflows/football-v5-weekend-shadow.yml
  workflow_dispatch:
  schedule:
    - cron: "0 7 11 10 *"

concurrency:
  group: football-v5-weekend-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: V5 regression and full suite
        run: |
          python -m py_compile src/gool_bot2/football_v5_shadow.py src/gool_bot2/v4_shadow_report.py scripts/gool_football_v5_weekend.py scripts/gool_flashscore_today.py
          pytest -q tests/test_football_v5_shadow.py
          pytest -q

  real-fixtures:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Never send actual Telegram bets or modify production selection.
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    timeout-minutes: 55
    env:
      GOOL_FOOTBALL_V5_SHADOW_ENABLED: "1"
      GOOL_PREMATCH_DELIVER: "0"
      GOOL_VALUE_HUNTER_ACTIVE: "0"
      GOOL_FLASHSCORE_SEGMENT_MAX_HOSTS: "1"
      RUNTIME_DATA_DIR: "artifacts/football_v5/runtime"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Scan real fixtures without placing or sending any bets
        shell: bash
        run: |
          mkdir -p artifacts/football_v5
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
              ARGS="--days 0 --max-total 1100 --max-per-day 1100 --workers 18 --price-limit 60"
            else
              ARGS="--days 0,1 --max-total 1600 --max-per-day 1100 --workers 18 --price-limit 80"
            fi
          else
            ARGS="--days 0,1 --max-total 48 --max-per-day 24 --workers 8 --price-limit 12"
          fi
          python scripts/gool_football_v5_weekend.py $ARGS --output artifacts/football_v5/weekend.jsonl \
            2>&1 | tee artifacts/football_v5/run.log
      - name: Publish audit summary
        if: always()
        run: |
          echo "## Football V5 real fixtures shadow" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'FOOTBALL_V5_(WEEKEND_START|PROGRESS|WEEKEND_DONE|ODDS_UNAVAILABLE)' artifacts/football_v5/run.log | tail -30 >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-v5-weekend-${{ github.run_id }}
          path: artifacts/football_v5/
          retention-days: 14
