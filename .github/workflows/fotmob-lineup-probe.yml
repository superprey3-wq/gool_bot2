name: fotmob lineup probe

on:
  push:
    branches:
      - feature/match-selection-intelligence
    paths:
      - 'scripts/gool_fotmob_lineup_probe.py'
      - '.github/workflows/fotmob-lineup-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Probe FotMob lineups
        run: python scripts/gool_fotmob_lineup_probe.py
