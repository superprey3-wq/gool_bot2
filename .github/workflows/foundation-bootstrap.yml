name: foundation-bootstrap

# Legacy model-training pipeline. GOOL V4 production does not depend on it.
# Keep it available only for deliberate offline experiments; never retrain on main pushes.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'

      - name: Restore optional last known-good GOOL models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf data/known_good data/known_good_fd
          mkdir -p data/known_good data/known_good_fd models data/foundation_bootstrap/models data/foundation_bootstrap/artifacts

          EVENT_RUN=33322385093
          FD_RUN=33328862619
          EVENT_OK=0
          FD_OK=0

          if gh run download "$EVENT_RUN" --repo "${{ github.repository }}" --name gool-wyscout-statsbomb-foundation --dir data/known_good; then
            cp data/known_good/models/archive_foundation_wyscout_statsbomb.pkl models/archive_foundation.pkl
            cp data/known_good/models/archive_hazard_wyscout_statsbomb.pkl models/archive_hazard.pkl
            cp models/archive_foundation.pkl data/foundation_bootstrap/models/archive_foundation_known_good.pkl
            cp models/archive_hazard.pkl data/foundation_bootstrap/models/archive_hazard_known_good.pkl
            cp data/known_good/artifacts/combined_training_summary.json data/foundation_bootstrap/artifacts/known_good_training_summary.json
            EVENT_OK=1
          else
            echo "::warning::Known-good event artifact from run $EVENT_RUN is unavailable/expired; continuing with fresh foundation training."
          fi

          if gh run download "$FD_RUN" --repo "${{ github.repository }}" --name gool-football-data-three-systems --dir data/known_good_fd; then
            cp data/known_good_fd/models/football_data_goal_models.pkl models/football_data_goal_models.pkl
            cp models/football_data_goal_models.pkl data/foundation_bootstrap/models/football_data_goal_models_known_good.pkl
            cp data/known_good_fd/artifacts/football_data_goal_metrics.json data/foundation_bootstrap/artifacts/football_data_goal_metrics_known_good.json
            FD_OK=1
          else
            echo "::warning::Known-good football-data artifact from run $FD_RUN is unavailable/expired; continuing without the optional reference model."
          fi

          python - "$EVENT_OK" "$FD_OK" <<'PY'
          import json
          import sys
          from pathlib import Path

          event_ok = sys.argv[1] == "1"
          fd_ok = sys.argv[2] == "1"
          status = {
              "status": "restored" if event_ok or fd_ok else "unavailable",
              "event_source_run_id": 33322385093,
              "event_reference_available": event_ok,
              "football_data_source_run_id": 33328862619,
              "football_data_reference_available": fd_ok,
              "note": "Known-good artifacts are optional references; fresh foundation training continues when they expire.",
          }
          Path("data/foundation_bootstrap/artifacts/known_good_model_install.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Fetch and validate pretrained short-term goal models
        run: |
          python -m gool_bot2.external_first_half_model \
            --cache-dir data/pretrained/shortterm_soccer \
            --ranks rank2 rank3 \
            > data/foundation_bootstrap/artifacts/external_pretrained_manifest.json
          cat data/foundation_bootstrap/artifacts/external_pretrained_manifest.json

      - name: Phase 1 - download import and prepare archive dataset
        run: python -m gool_bot2.prepare_foundation --work-dir data/foundation_bootstrap --step 2

      - name: Show archive preparation summary
        run: cat data/foundation_bootstrap/artifacts/foundation_prepare_summary.json

      - name: Phase 2 - train GOOL models from prepared dataset
        run: python -m gool_bot2.train_prepared_foundation --work-dir data/foundation_bootstrap

      - name: Split archive by halftime score and final score
        run: python -m gool_bot2.evaluate_ht_over25_proxy

      - name: Show halftime to final score report
        run: cat data/foundation_bootstrap/artifacts/halftime_final_score_report.json

      - name: Show training summary
        run: cat data/foundation_bootstrap/artifacts/foundation_bootstrap_summary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gool-foundation-models
          path: |
            data/foundation_bootstrap/models/*.pkl
            data/foundation_bootstrap/artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
