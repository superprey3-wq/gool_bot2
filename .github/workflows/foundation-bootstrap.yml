name: foundation-bootstrap

on:
  push:
    branches: [main, foundation-bootstrap, experiment/ht-one-goal-over25]
    paths:
      - 'src/gool_bot2/bootstrap_foundation.py'
      - 'src/gool_bot2/prepare_foundation.py'
      - 'src/gool_bot2/train_prepared_foundation.py'
      - 'src/gool_bot2/external_first_half_model.py'
      - 'src/gool_bot2/archive_wyscout.py'
      - 'src/gool_bot2/archive_statsbomb.py'
      - 'src/gool_bot2/archive_dataset.py'
      - 'src/gool_bot2/train_archive_models.py'
      - 'src/gool_bot2/train_hazard_models.py'
      - 'src/gool_bot2/evaluate_ht_over25_proxy.py'
      - '.github/workflows/foundation-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'

      - name: Install last known-good trained GOOL models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf data/known_good
          mkdir -p data/known_good models data/foundation_bootstrap/models data/foundation_bootstrap/artifacts
          gh run download 33322385093 \
            --repo "${{ github.repository }}" \
            --name gool-wyscout-statsbomb-foundation \
            --dir data/known_good
          cp data/known_good/models/archive_foundation_wyscout_statsbomb.pkl models/archive_foundation.pkl
          cp data/known_good/models/archive_hazard_wyscout_statsbomb.pkl models/archive_hazard.pkl
          cp models/archive_foundation.pkl data/foundation_bootstrap/models/archive_foundation_known_good.pkl
          cp models/archive_hazard.pkl data/foundation_bootstrap/models/archive_hazard_known_good.pkl
          cp data/known_good/artifacts/combined_training_summary.json data/foundation_bootstrap/artifacts/known_good_training_summary.json
          python - <<'PY'
          import json
          import pickle
          from pathlib import Path

          direct_path = Path('models/archive_foundation.pkl')
          hazard_path = Path('models/archive_hazard.pkl')
          with direct_path.open('rb') as fh:
              direct = pickle.load(fh)
          with hazard_path.open('rb') as fh:
              hazard = pickle.load(fh)
          status = {
              'status': 'installed',
              'source_run_id': 33322385093,
              'source_artifact': 'gool-wyscout-statsbomb-foundation',
              'direct_model': str(direct_path),
              'hazard_model': str(hazard_path),
              'direct_heads': sorted(direct.get('heads', {}).keys()),
              'hazard_heads': sorted(hazard.get('heads', {}).keys()),
          }
          Path('data/foundation_bootstrap/artifacts/known_good_model_install.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Fetch and validate pretrained short-term goal models
        run: |
          python -m gool_bot2.external_first_half_model \
            --cache-dir data/pretrained/shortterm_soccer \
            --ranks rank2 rank3 \
            > data/foundation_bootstrap/artifacts/external_pretrained_manifest.json
          cat data/foundation_bootstrap/artifacts/external_pretrained_manifest.json

      - name: Phase 1 - download import and prepare archive dataset
        run: python -m gool_bot2.prepare_foundation --work-dir data/foundation_bootstrap --step 2

      - name: Show archive preparation summary
        run: cat data/foundation_bootstrap/artifacts/foundation_prepare_summary.json

      - name: Phase 2 - train GOOL models from prepared dataset
        run: python -m gool_bot2.train_prepared_foundation --work-dir data/foundation_bootstrap

      - name: Split archive by halftime score and final score
        run: python -m gool_bot2.evaluate_ht_over25_proxy

      - name: Show halftime to final score report
        run: cat data/foundation_bootstrap/artifacts/halftime_final_score_report.json

      - name: Show training summary
        run: cat data/foundation_bootstrap/artifacts/foundation_bootstrap_summary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gool-foundation-models
          path: |
            data/foundation_bootstrap/models/*.pkl
            data/foundation_bootstrap/artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
