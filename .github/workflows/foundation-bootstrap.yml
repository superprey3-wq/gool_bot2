name: foundation-bootstrap

on:
  push:
    branches: [main, foundation-bootstrap, experiment/ht-one-goal-over25]
    paths:
      - 'src/gool_bot2/bootstrap_foundation.py'
      - 'src/gool_bot2/prepare_foundation.py'
      - 'src/gool_bot2/train_prepared_foundation.py'
      - 'src/gool_bot2/archive_wyscout.py'
      - 'src/gool_bot2/archive_statsbomb.py'
      - 'src/gool_bot2/archive_dataset.py'
      - 'src/gool_bot2/train_archive_models.py'
      - 'src/gool_bot2/train_hazard_models.py'
      - 'src/gool_bot2/evaluate_ht_over25_proxy.py'
      - '.github/workflows/foundation-bootstrap.yml'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'

      - name: Phase 1 - download import and prepare archive dataset
        run: python -m gool_bot2.prepare_foundation --work-dir data/foundation_bootstrap --step 2

      - name: Show archive preparation summary
        run: cat data/foundation_bootstrap/artifacts/foundation_prepare_summary.json

      - name: Phase 2 - train GOOL models from prepared dataset
        run: python -m gool_bot2.train_prepared_foundation --work-dir data/foundation_bootstrap

      - name: Evaluate HT 1-0/0-1 Over 2.5-equivalent segment
        run: python -m gool_bot2.evaluate_ht_over25_proxy

      - name: Show HT Over 2.5 proxy metrics
        run: cat data/foundation_bootstrap/artifacts/ht_one_goal_over25_proxy_metrics.json

      - name: Show training summary
        run: cat data/foundation_bootstrap/artifacts/foundation_bootstrap_summary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gool-foundation-models
          path: |
            data/foundation_bootstrap/models/*.pkl
            data/foundation_bootstrap/artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
