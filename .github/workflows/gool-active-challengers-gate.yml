name: GOOL active challenger production gate

on:
  pull_request:
    paths:
      - "src/gool_bot2/active_challenger_decisions.py"
      - "src/gool_bot2/xbet_multisport_steam.py"
      - "src/gool_bot2/production_signal_throughput.py"
      - "scripts/gool_flashscore_today.py"
      - "tests/test_active_challenger_decisions.py"
      - ".github/workflows/gool-active-challengers-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/gool_bot2/active_challenger_decisions.py"
      - "src/gool_bot2/xbet_multisport_steam.py"
      - "src/gool_bot2/production_signal_throughput.py"
      - "scripts/gool_flashscore_today.py"
      - "tests/test_active_challenger_decisions.py"
      - ".github/workflows/gool-active-challengers-gate.yml"
  workflow_dispatch:

jobs:
  active-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Compile all four active selector integrations
        run: |
          python -m py_compile src/gool_bot2/active_challenger_decisions.py src/gool_bot2/xbet_multisport_steam.py src/gool_bot2/production_signal_throughput.py scripts/gool_flashscore_today.py
          pytest -q tests/test_active_challenger_decisions.py tests/test_hockey_prematch_ev_shadow.py tests/test_basketball_v4_shadow.py tests/test_football_v6_consensus_shadow.py tests/test_production_signal_throughput.py
      - run: pytest -q

  active-football-real-data:
    runs-on: ubuntu-latest
    needs: active-unit-tests
    timeout-minutes: 35
    env:
      GOOL_FOOTBALL_V5_ACTIVE: "1"
      GOOL_FOOTBALL_V6_ACTIVE: "1"
      GOOL_FOOTBALL_V6_SHADOW_ENABLED: "1"
      GOOL_PREMATCH_DELIVER: "0"
      GOOL_VALUE_HUNTER_ACTIVE: "0"
      GOOL_PREMATCH_WORKERS: "16"
      GOOL_FOOTBALL_V5_SHORTLIST_CAP: "12"
      GOOL_PREMATCH_FUSION_LIMIT: "6"
      GOOL_PREMATCH_FUSION_RESCUE_TRIGGER: "0"
      GOOL_PREMATCH_FUSION_WORKERS: "4"
      RUNTIME_DATA_DIR: "artifacts/active_challengers/runtime"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Real 1xBet and Flashscore V6 ACTIVE decision test, never deliver
        shell: bash
        run: |
          mkdir -p artifacts/active_challengers
          python scripts/gool_flashscore_today.py 2>&1 | tee artifacts/active_challengers/prematch.log
          grep -q "FOOTBALL_BRAIN_ACTIVE V6" artifacts/active_challengers/prematch.log
          grep -q "FOOTBALL_V6_ACTIVE_SHORTLIST" artifacts/active_challengers/prematch.log
          grep -q "FOOTBALL_V6_ACTIVE " artifacts/active_challengers/prematch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gool-active-challengers-${{ github.run_id }}
          path: artifacts/active_challengers/
          retention-days: 10
