name: GOOL Flashscore Today
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Build today's direct Flashscore picks
        env:
          GOOL_PREMATCH_WORKERS: "20"
        run: python scripts/gool_flashscore_today.py
