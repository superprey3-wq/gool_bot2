name: GOOL LIVE Brain V4 audit

on:
  workflow_dispatch:
  push:
    branches: [gool-v4-rebuild, fix/xbet-live-index-blackout]
    paths:
      - 'src/gool_bot2/live_goal_brain_v4.py'
      - 'src/gool_bot2/multi_runtime.py'
      - 'tests/test_live_v4_production_integration.py'
      - 'src/gool_bot2/live_momentum.py'
      - 'src/gool_bot2/live_collector.py'
      - 'src/gool_bot2/providers/fotmob_lineup_guard.py'
      - 'scripts/gool_live_brain_v4_audit.py'
      - '.github/workflows/gool-live-brain-v4.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Restore LIVE Policy shadow journal
        uses: actions/cache/restore@v4
        with:
          path: artifacts/live_policy_shadow
          key: live-policy-shadow-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-policy-shadow-${{ github.ref_name }}-
      - name: Run LIVE Brain V4 against real matches
        env:
          GOOL_POLICY_SHADOW_JOURNAL: artifacts/live_policy_shadow/journal.json
        run: python scripts/gool_live_brain_v4_audit.py
      - name: Save LIVE Policy shadow journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/live_policy_shadow
          key: live-policy-shadow-${{ github.ref_name }}-${{ github.run_id }}
