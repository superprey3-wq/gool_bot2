name: GOOL LIVE V4 end-to-end audit

on:
  workflow_dispatch:
  push:
    branches: [gool-v4-rebuild]
    paths:
      - 'scripts/gool_live_v4_e2e_audit.py'
      - 'src/gool_bot2/live_goal_brain_v4.py'
      - 'src/gool_bot2/multi_router.py'
      - 'src/gool_bot2/xbet_market_robust.py'
      - '.github/workflows/gool-live-v4-e2e.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Run V4 through real LIVE odds and VALUE router
        run: python scripts/gool_live_v4_e2e_audit.py
