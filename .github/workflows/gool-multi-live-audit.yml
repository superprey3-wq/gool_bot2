name: GOOL Multi real LIVE audit

on:
  push:
    branches:
      - main
      - feature/gool-multi-router
    paths:
      - 'src/gool_bot2/__init__.py'
      - 'src/gool_bot2/architecture_isolation.py'
      - 'src/gool_bot2/production_calibration.py'
      - 'src/gool_bot2/goal_state_engine.py'
      - 'scripts/gool_multi_live_audit.py'
      - 'scripts/gool_multi_card_preview.py'
      - 'src/gool_bot2/multi_*.py'
      - 'src/gool_bot2/xbet_market_pressure.py'
      - 'src/gool_bot2/xbet_market_robust.py'
      - 'src/gool_bot2/xbet_market_worker.py'
      - 'src/gool_bot2/providers/flashscore.py'
      - 'tests/test_zero_signal_audit.py'
      - 'tests/test_multi_router.py'
      - 'tests/test_multi_neutral_market.py'
      - 'tests/test_multi_market_opposition.py'
      - 'tests/test_multi_first_half_value.py'
      - 'tests/test_multi_min_odd.py'
      - 'tests/test_multi_cards_delivery.py'
      - 'tests/test_multi_card_journal_assets.py'
      - 'tests/test_multi_journal.py'
      - 'tests/test_multi_menu.py'
      - 'tests/test_multi_bank.py'
      - 'tests/test_multi_model_capture.py'
      - 'tests/test_xbet_market_robust.py'
      - 'tests/test_xbet_first_half_child.py'
      - '.github/workflows/gool-multi-live-audit.yml'
  workflow_dispatch:

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install GOOL Bot 2
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Production zero-signal safety check
        run: pytest -q tests/test_zero_signal_audit.py tests/test_architecture_isolation.py tests/test_multi_autonomous_steam.py tests/test_xbet_market_robust.py

      - name: Render Multi signal/result card previews
        run: python scripts/gool_multi_card_preview.py --out-dir artifacts/gool_multi_cards

      - name: Capture current Flashscore LIVE and standard 1xBet markets
        env:
          XBET_MATCH_MIN_SCORE: '0.68'
          XBET_GAME_WORKERS: '8'
          XBET_INDEX_CACHE_SECONDS: '75'
        run: python scripts/gool_multi_live_audit.py --snapshots 3 --interval 15 --out-dir artifacts/gool_multi_live_audit

      - name: Show report in job summary
        if: always()
        run: |
          if [ -f artifacts/gool_multi_live_audit/report.md ]; then
            cat artifacts/gool_multi_live_audit/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GOOL MULTI audit report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gool-multi-live-audit
          path: artifacts/gool_multi_live_audit/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gool-multi-card-previews
          path: artifacts/gool_multi_cards/
          if-no-files-found: warn
          retention-days: 7
