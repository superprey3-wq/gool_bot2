name: GOOL Multi score verification audit

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/gool_multi_score_audit.py'
      - 'src/gool_bot2/xbet_score_epoch_guard.py'
      - 'src/gool_bot2/xbet_robust_event_guard.py'
      - 'src/gool_bot2/xbet_market_robust.py'
      - '.github/workflows/gool-multi-score-audit.yml'
  workflow_dispatch:

jobs:
  score-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install GOOL Bot 2
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Score guard safety tests
        run: pytest -q tests/test_xbet_score_epoch_guard.py tests/test_xbet_robust_event_guard.py

      - name: Repeated real LIVE score audit
        env:
          XBET_MATCH_MIN_SCORE: '0.68'
          XBET_GAME_WORKERS: '8'
          XBET_INDEX_CACHE_SECONDS: '75'
        run: python scripts/gool_multi_score_audit.py --max-cycles 12 --interval 20 --out-dir artifacts/gool_multi_score_audit

      - name: Show report
        if: always()
        run: |
          if [ -f artifacts/gool_multi_score_audit/report.md ]; then
            cat artifacts/gool_multi_score_audit/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Score audit report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gool-multi-score-audit
          path: artifacts/gool_multi_score_audit/
          if-no-files-found: warn
          retention-days: 7
