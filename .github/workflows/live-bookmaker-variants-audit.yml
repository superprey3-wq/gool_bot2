name: live-bookmaker-variants-audit

on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: Number of live snapshots
        required: false
        default: "3"
      interval:
        description: Seconds between snapshots
        required: false
        default: "45"
      limit:
        description: Maximum Flashscore live matches
        required: false
        default: "1000"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-bookmaker-variants-audit.yml"
      - "scripts/live_bookmaker_variants_audit.py"
      - "src/gool_bot2/providers/flashscore.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GOOL bot
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run all-live bookmaker audit
        env:
          SNAPSHOTS: ${{ inputs.snapshots || '3' }}
          INTERVAL: ${{ inputs.interval || '45' }}
          MATCH_LIMIT: ${{ inputs.limit || '1000' }}
        run: |
          python scripts/live_bookmaker_variants_audit.py \
            --output-dir live_bookmaker_audit \
            --snapshots "$SNAPSHOTS" \
            --interval "$INTERVAL" \
            --limit "$MATCH_LIMIT"

      - name: Publish audit summary
        if: always()
        run: |
          echo '## GOOL Flashscore → Kambi/Unibet + Bet365 + Betano' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f live_bookmaker_audit/summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('live_bookmaker_audit/summary.json').read_text())
          print(f"Flashscore live matches seen: **{data.get('unique_flashscore_live_matches', 0)}**")
          print(f"Snapshots: **{data.get('snapshot_count', 0)}**")
          print('')
          print('### Source results')
          for source, counts in data.get('source_summary', {}).items():
              parts = ', '.join(f"{k}={v}" for k, v in sorted(counts.items())) or 'no matches'
              print(f"- **{source}**: {parts}")
          print('')
          print('### Global verdicts')
          for verdict, count in sorted(data.get('verdict_counts', {}).items()):
              print(f"- **{verdict}**: {count}")
          PY
          else
            echo 'summary.json was not produced' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist compact latest report in repository
        if: always()
        run: |
          if [ -f live_bookmaker_audit/summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          src = Path('live_bookmaker_audit/summary.json')
          data = json.loads(src.read_text())
          compact = {
              'generated_at': data.get('generated_at'),
              'snapshot_count': data.get('snapshot_count'),
              'unique_flashscore_live_matches': data.get('unique_flashscore_live_matches'),
              'source_states': data.get('source_states'),
              'source_summary': data.get('source_summary'),
              'verdict_counts': data.get('verdict_counts'),
              'events': [],
          }
          for event in data.get('events', []):
              compact['events'].append({
                  'event_id': event.get('event_id'),
                  'home': event.get('home'),
                  'away': event.get('away'),
                  'league': event.get('league'),
                  'flashscore_states': event.get('flashscore_states'),
                  'sources': {
                      source: {
                          'verdict': payload.get('verdict'),
                          'odds_changed': payload.get('odds_changed'),
                          'flashscore_progress': payload.get('flashscore_progress'),
                          'matched_snapshots': sum(1 for row in payload.get('snapshots', []) if row.get('status') == 'matched'),
                      }
                      for source, payload in event.get('sources', {}).items()
                  },
              })
          out = Path('reports/live_bookmaker_variants/latest-summary.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(compact, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
          PY
            git config user.name "gool-bot2-actions"
            git config user.email "gool-bot2-actions@users.noreply.github.com"
            git add reports/live_bookmaker_variants/latest-summary.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update live bookmaker audit report"
              git push
            fi
          fi

      - name: Upload full audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-bookmaker-variants-audit
          path: live_bookmaker_audit/
          if-no-files-found: warn
          retention-days: 7
