name: Local LLM football reviewer diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - test/free-market-mechanics
    paths:
      - scripts/local_llm_reviewer_diagnostic.py
      - .github/workflows/local_llm_reviewer.yml

permissions:
  contents: read

jobs:
  blind-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull local models (no API keys)
        run: |
          ollama pull qwen2.5:7b
          ollama pull llama3.2:3b
          ollama list

      - name: Blind-review Araba vs Hapoel with both models
        env:
          LOCAL_LLM_MODELS: qwen2.5:7b,llama3.2:3b
        run: python scripts/local_llm_reviewer_diagnostic.py

      - name: Show result
        if: always()
        run: |
          test -f local_llm_reviewer_result.json && cat local_llm_reviewer_result.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-llm-reviewer-result
          path: local_llm_reviewer_result.json
          if-no-files-found: warn
