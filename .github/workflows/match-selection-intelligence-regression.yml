name: match selection intelligence regression

on:
  push:
    branches:
      - feature/match-selection-intelligence
    paths:
      - 'src/gool_bot2/multi_match_intelligence.py'
      - 'src/gool_bot2/multi_true_prematch.py'
      - 'src/gool_bot2/xbet_prematch_market.py'
      - 'src/gool_bot2/xbet_market_worker.py'
      - 'src/gool_bot2/multi_runtime.py'
      - 'src/gool_bot2/multi_entry_enrichment.py'
      - 'tests/test_multi_match_intelligence.py'
      - 'tests/test_xbet_prematch_market.py'
      - 'tests/test_multi_runtime_coverage.py'
      - '.github/workflows/match-selection-intelligence-regression.yml'
  pull_request:
    paths:
      - 'src/gool_bot2/multi_match_intelligence.py'
      - 'src/gool_bot2/multi_true_prematch.py'
      - 'src/gool_bot2/xbet_prematch_market.py'
      - 'src/gool_bot2/xbet_market_worker.py'
      - 'src/gool_bot2/multi_runtime.py'
      - 'src/gool_bot2/multi_entry_enrichment.py'
      - 'tests/test_multi_match_intelligence.py'
      - 'tests/test_xbet_prematch_market.py'
      - 'tests/test_multi_runtime_coverage.py'
      - '.github/workflows/match-selection-intelligence-regression.yml'
  workflow_dispatch:

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff
      - name: Run match intelligence regressions
        run: |
          pytest -q \
            tests/test_multi_match_intelligence.py \
            tests/test_xbet_prematch_market.py \
            tests/test_multi_runtime_coverage.py \
            tests/test_multi_two_system_concept.py \
            tests/test_multi_another_goal_guard.py
      - name: Ruff correctness gate
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/gool_bot2/multi_match_intelligence.py \
            src/gool_bot2/multi_true_prematch.py \
            src/gool_bot2/xbet_prematch_market.py \
            src/gool_bot2/xbet_market_worker.py \
            src/gool_bot2/multi_runtime.py \
            src/gool_bot2/multi_entry_enrichment.py \
            tests/test_multi_match_intelligence.py \
            tests/test_xbet_prematch_market.py
