name: Multisport real PREMATCH LIVE audit

on:
  pull_request:
    paths:
      - "scripts/gool_multisport_real_audit.py"
      - "src/gool_bot2/xbet_multisport_steam.py"
      - "src/gool_bot2/xbet_multisport_card.py"
      - ".github/workflows/multisport-real-prematch-live-audit.yml"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run real hockey and basketball audit
        env:
          AUDIT_SNAPSHOTS: "1"
          AUDIT_SLEEP_SECONDS: "5"
          GOOL_MULTISPORT_MODE: shadow
          XBET_MULTISPORT_TELEGRAM_ENABLED: "0"
        run: python scripts/gool_multisport_real_audit.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/multisport_real_audit/report.md ]; then
            cat artifacts/multisport_real_audit/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multisport-real-prematch-live-audit
          path: artifacts/multisport_real_audit/
          retention-days: 7
