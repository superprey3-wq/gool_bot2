name: old-odds-sources-smoke-push

on:
  push:
    paths:
      - '.github/workflows/old-odds-sources-smoke-push.yml'
  workflow_dispatch:

jobs:
  probe-old-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout legacy GOOL odds code
        uses: actions/checkout@v4
        with:
          repository: superprey3-wq/gool_bot
          path: legacy_gool
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install requests httpx
      - name: Inventory legacy odds modules
        run: |
          find legacy_gool -type f | grep -Ei '(odds|kambi|bovada|sports.?game|fair_value|clv)' | sort | tee legacy_odds_files.txt
      - name: Compile legacy repository
        run: |
          python - <<'PY'
          import compileall
          print('compile_ok=', compileall.compile_dir('legacy_gool', quiet=1))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-odds-smoke-push
          path: legacy_odds_files.txt
