name: patch-delivery-backoff
on:
  push:
    branches: [fix/runtime-stall-hardening-20260905]
    paths:
      - 'scripts/patch_delivery_backoff.py'
      - '.github/workflows/patch-delivery-backoff.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-stall-hardening-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply delivery backoff
        run: python scripts/patch_delivery_backoff.py
      - name: Remove temporary patch machinery and commit
        run: |
          rm scripts/patch_delivery_backoff.py
          rm .github/workflows/patch-delivery-backoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add delivery timeout circuit and retry backoff'
          git push origin HEAD:fix/runtime-stall-hardening-20260905
