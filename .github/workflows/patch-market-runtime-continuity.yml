name: patch-market-runtime-continuity

on:
  push:
    branches:
      - feature/all-market-watch-one-brain
    paths:
      - 'scripts/patch_market_runtime_continuity.py'
      - '.github/workflows/patch-market-runtime-continuity.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[market-runtime-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/all-market-watch-one-brain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/patch_market_runtime_continuity.py
      - name: Remove temporary patch machinery and commit
        run: |
          rm scripts/patch_market_runtime_continuity.py
          rm .github/workflows/patch-market-runtime-continuity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep market hunters alive on every LIVE minute [market-runtime-patched]"
          git push origin HEAD:feature/all-market-watch-one-brain
