name: pr76-debug

on:
  push:
    branches:
      - fix/production-signal-throughput-20260913

jobs:
  pytest-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Capture pytest output
        shell: bash
        run: |
          set +e
          pytest -q > pytest.log 2>&1
          code=$?
          cat pytest.log
          echo "$code" > pytest.exit
          exit 0
      - name: Upload pytest diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr76-pytest-log
          path: |
            pytest.log
            pytest.exit
