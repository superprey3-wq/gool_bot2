name: PROGRUZ 1 two-sided pressure regressions (isolated CI)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/progruz1-two-sided-regression.yml
      - ci_progruz1_two_sided/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenario-pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile production LIVE scanner and Telegram status code
        run: |
          cd ci_progruz1_two_sided
          python -m py_compile gool_adaptive_runtime.py gool_adaptive_flashscore.py progruz1_telegram_journal.py progruz1_flashscore_preobserve.py
      - name: Test exact PROGRUZ1 TWO_SIDED classifier snapshot
        run: |
          cd ci_progruz1_two_sided
          python -m py_compile gool_adaptive_runtime.py progruz1_live_watchlist.py progruz1_flashscore_preobserve.py
          python -m pytest -q test_two_sided.py test_goal_hard_veto.py test_watchlist.py test_preobserve.py test_fast_strong_scenarios.py
