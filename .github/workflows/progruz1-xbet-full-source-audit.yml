name: PROGRUZ 1 · 1xBet full LIVE football benchmark (GOOL2 runner)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/progruz1-xbet-full-source-audit.yml
      - scripts/progruz1_xbet_live_standalone_audit.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xbet-full-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GOOL2 existing proven source and tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Offline source regression
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest -q \
            tests/test_xbet_market_robust.py \
            tests/test_xbet_multisport_steam.py \
            tests/test_xbet_first_half_child.py \
            2>&1 | tee reports/progruz1-xbet-tests-latest.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Query all current LIVE football with 1xBet legacy and v3
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          python scripts/progruz1_xbet_live_standalone_audit.py \
            2>&1 | tee reports/progruz1-xbet-run-latest.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload source findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-live-xbet-football-audit
          path: |
            reports/progruz1-xbet-source-latest.json
            reports/progruz1-xbet-tests-latest.txt
            reports/progruz1-xbet-run-latest.txt
          retention-days: 14
      - name: Save measured summary for review
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/progruz1-xbet-source-latest.json \
                  reports/progruz1-xbet-tests-latest.txt \
                  reports/progruz1-xbet-run-latest.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Audit 1xBet LIVE football source coverage"
            git push origin HEAD:main || echo 'Artifacts retained on GitHub'
          fi
