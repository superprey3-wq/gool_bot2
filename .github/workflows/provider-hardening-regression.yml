name: provider hardening regression

on:
  push:
    paths:
      - 'src/gool_bot2/providers/**'
      - 'src/gool_bot2/multi_shadow.py'
      - 'src/gool_bot2/multi_entry_enrichment.py'
      - 'tests/test_providers.py'
      - 'tests/test_provider_timing_capture.py'
      - 'scripts/gool_provider_hardening_probe.py'
      - '.github/workflows/provider-hardening-regression.yml'
  pull_request:
    paths:
      - 'src/gool_bot2/providers/**'
      - 'src/gool_bot2/multi_shadow.py'
      - 'src/gool_bot2/multi_entry_enrichment.py'
      - 'tests/test_providers.py'
      - 'tests/test_provider_timing_capture.py'
      - 'scripts/gool_provider_hardening_probe.py'
      - '.github/workflows/provider-hardening-regression.yml'
  workflow_dispatch:

jobs:
  provider-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install GOOL Bot 2
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Provider and timing unit regressions
        run: pytest -q tests/test_providers.py tests/test_provider_timing_capture.py

      - name: Ruff correctness gate
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/gool_bot2/providers/flashscore_incident_guard.py \
            src/gool_bot2/providers/secondary_live_guard.py \
            src/gool_bot2/providers/fotmob_freshness_guard.py \
            src/gool_bot2/providers/fusion.py \
            src/gool_bot2/providers/__init__.py \
            src/gool_bot2/multi_shadow.py \
            src/gool_bot2/multi_entry_enrichment.py \
            scripts/gool_provider_hardening_probe.py \
            tests/test_providers.py \
            tests/test_provider_timing_capture.py

      - name: Real Leones provider regression
        run: python scripts/gool_provider_hardening_probe.py
