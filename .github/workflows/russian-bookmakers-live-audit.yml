name: Russian bookmakers live audit
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/russian_bookmakers_live_audit.py
      - .github/workflows/russian-bookmakers-live-audit.yml
permissions:
  contents: write
concurrency:
  group: russian-bookmakers-live-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Three live snapshots
        continue-on-error: true
        run: python scripts/russian_bookmakers_live_audit.py --output-dir russian_bookmakers_audit --snapshots 3 --interval 35
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: russian-bookmakers-live-audit
          path: russian_bookmakers_audit/
      - name: Persist report
        if: always()
        shell: bash
        run: |
          test -f russian_bookmakers_audit/summary.json || exit 0
          mkdir -p reports/russian_bookmakers
          cp russian_bookmakers_audit/summary.json reports/russian_bookmakers/latest-summary.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/russian_bookmakers/latest-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update Russian bookmakers live audit report'
          for n in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((n*3)); done
          exit 1
