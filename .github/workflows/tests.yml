name: tests

on:
  push:
    branches: [main, archive-foundation, experiment/ht-one-goal-over25, experiment/halftime-second-half, gool-v4-rebuild]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src scripts monkey_start.py monkey_autoupdate.py
      - run: pytest -q
      - name: V4 deployment smoke check
        run: |
          python -m py_compile \
            src/gool_bot2/v4_prematch_engine.py \
            src/gool_bot2/v4_live_policy.py \
            src/gool_bot2/v4_prematch_lifecycle.py \
            src/gool_bot2/v4_prematch_delivery.py \
            src/gool_bot2/v4_prematch_card.py \
            src/gool_bot2/v4_prematch_settlement.py \
            src/gool_bot2/prematch_full_market_runtime.py \
            src/gool_bot2/full_market_brain.py \
            src/gool_bot2/live_for_against_judge.py \
            src/gool_bot2/production_signal_throughput.py \
            src/gool_bot2/multi_runtime.py \
            src/gool_bot2/multi_menu.py \
            src/gool_bot2/telegram.py
          python - <<'PY'
          from gool_bot2.v4_prematch_engine import build_prematch_candidates
          from gool_bot2.v4_live_policy import decide_live_v4
          from gool_bot2.v4_prematch_lifecycle import sync_prematch_with_live_record
          from gool_bot2.v4_prematch_delivery import prematch_keyboard
          from gool_bot2.v4_prematch_card import render_v4_prematch_card
          from gool_bot2.v4_prematch_settlement import settle_prematch_pick
          from gool_bot2.multi_runtime import observe_multi_shadow
          from gool_bot2.multi_menu import in_game_sections
          assert prematch_keyboard("smoke")["inline_keyboard"][0][0]["callback_data"] == "v4ig:smoke"
          assert settle_prematch_pick({"market": "ТБ 2.5"}, 2, 1) == "won"
          print("V4_DEPLOY_SMOKE_OK")
          PY
      - name: Build Monkey deployment bundle
        run: |
          rm -rf deploy_bundle GOOL_BOT2_MONKEY_CODE.zip
          mkdir -p deploy_bundle
          cp -R src deploy_bundle/
          cp pyproject.toml README.md .env.example monkey_start.py monkey_autoupdate.py requirements.txt deploy_bundle/
          cp -R docs scripts config deploy_bundle/
          test -f deploy_bundle/scripts/gool_flashscore_today.py
          test -f deploy_bundle/monkey_start.py
          test -f deploy_bundle/monkey_autoupdate.py
          test -f deploy_bundle/requirements.txt
          test -f deploy_bundle/src/gool_bot2/storage_market_signal_worker_var.py
          (cd deploy_bundle && zip -qr ../GOOL_BOT2_MONKEY_CODE.zip .)
      - name: Verify Monkey deployment bundle is bootable
        run: |
          unzip -Z1 GOOL_BOT2_MONKEY_CODE.zip | grep -qx 'monkey_start.py'
          unzip -Z1 GOOL_BOT2_MONKEY_CODE.zip | grep -qx 'monkey_autoupdate.py'
          unzip -Z1 GOOL_BOT2_MONKEY_CODE.zip | grep -qx 'requirements.txt'
          unzip -Z1 GOOL_BOT2_MONKEY_CODE.zip | grep -qx 'src/gool_bot2/storage_market_signal_worker_var.py'
          python -m py_compile deploy_bundle/monkey_start.py deploy_bundle/monkey_autoupdate.py
      - uses: actions/upload-artifact@v4
        with:
          name: gool-bot2-monkey-code
          path: GOOL_BOT2_MONKEY_CODE.zip
          retention-days: 14

  football-data-train:
    if: (github.event_name == 'pull_request' && github.head_ref == 'experiment/ht-one-goal-over25') || (github.event_name == 'push' && github.ref == 'refs/heads/experiment/ht-one-goal-over25')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Download Football-Data and train all three systems
        run: python -m gool_bot2.train_football_data_foundation --work-dir data/football_data_training
      - name: Show three-system training summary
        run: cat data/football_data_training/artifacts/football_data_training_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gool-football-data-three-systems
          path: |
            data/football_data_training/models/*.pkl
            data/football_data_training/artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
