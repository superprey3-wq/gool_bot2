name: UEFA Nations raw market probe

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/halftime-second-half
    paths:
      - scripts/uefa_nations_raw_market_probe.py
      - .github/workflows/uefa-nations-raw-market-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Inspect raw selections
        run: python scripts/uefa_nations_raw_market_probe.py
