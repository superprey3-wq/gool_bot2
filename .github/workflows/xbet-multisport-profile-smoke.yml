name: 1xBet multisport profile smoke

on:
  push:
    branches:
      - "hotfix/multisport-xbet-sport-profiles"
    paths:
      - "src/gool_bot2/xbet_multisport_steam.py"
      - ".github/workflows/xbet-multisport-profile-smoke.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare working football headers vs hockey/basketball
        run: |
          python - <<'PY'
          import gzip, json, urllib.parse, urllib.request

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
              "Accept": "application/json,*/*",
              "Origin": "https://1xbet.com",
              "Referer": "https://1xbet.com/live/football/",
              "X-Requested-With": "XMLHttpRequest",
              "is-srv": "false",
              "x-app-n": "__BETTING_APP__",
              "x-svc-source": "__BETTING_APP__",
              "x-mobile-project-id": "0",
          }

          cases = [
              ("FOOTBALL_WORKING", "LiveFeed", 1, {"count":1000,"lng":"en","mode":4,"country":1,"getEmpty":"true"}),
              ("HOCKEY_GH", "LiveFeed", 2, {"count":50,"lng":"en","gr":70,"mode":4,"country":71,"getEmpty":"true"}),
              ("BASKET_GH", "LiveFeed", 3, {"count":50,"lng":"en","gr":70,"mode":4,"country":71,"getEmpty":"true"}),
          ]
          roots = [
              "https://1xbet.com/service-api",
              "https://1xbet.com",
              "https://1xbet.fi/service-api",
              "https://1xbet.fi",
          ]

          for label, feed, sport, extra in cases:
              params = {"sports": sport, **extra}
              print("====", label, "====")
              for root in roots:
                  url = f"{root}/{feed}/Get1x2_VZip?" + urllib.parse.urlencode(params)
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=8) as resp:
                          body = resp.read()
                          ctype = resp.headers.get("Content-Type","")
                          status = resp.status
                      if body[:2] == b"\x1f\x8b":
                          body = gzip.decompress(body)
                      preview = body[:160].decode("utf-8","replace").replace("\n"," ")
                      try:
                          data = json.loads(body.decode("utf-8"))
                          value = data.get("Value") if isinstance(data, dict) else None
                          count = len(value) if isinstance(value, list) else 0
                          print(f"{label} root={root} http={status} type={ctype} json=1 count={count} success={data.get('Success')}")
                          if count:
                              for row in value[:2]:
                                  print(json.dumps({"I":row.get("I"),"SI":row.get("SI"),"L":row.get("L"),"O1":row.get("O1"),"O2":row.get("O2")},ensure_ascii=False))
                              break
                      except Exception as exc:
                          print(f"{label} root={root} http={status} type={ctype} json=0 preview={preview!r} err={type(exc).__name__}")
                  except Exception as exc:
                      print(f"{label} root={root} request_error={type(exc).__name__}:{exc}")
          PY
