[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gool-bot2"
version = "0.1.0"
description = "Live football probability engine for goal-related targets"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.5", "xgboost>=2.1"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
